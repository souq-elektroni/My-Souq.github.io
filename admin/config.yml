backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "اسم المنتج", name: "title", widget: "string"}
      - {label: "السعر", name: "price", widget: "string"}
      - {
          label: "التصنيف",
          name: "category",
          widget: "select",
          options: ["ملابس شتويه", "ملابس خروج", "أحذيه", "عروض"]
        }
      - {label: "صورة المنتج", name: "image", widget: "image"}
      - {label: "وصف المنتج", name: "description", widget: "text", required: false}
