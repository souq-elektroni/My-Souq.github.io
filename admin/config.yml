backend:
  name: github
  repo: souq-elektroni/My-Souq.github.io
  branch: main
  auth_methods: [oauth]
  base_url: https://sveltia-cms-auth.ahmedaly1g.workers.dev

publish_mode: editorial_workflow

media_folder: "images/products"
public_folder: "/images/products"

# تحويل الصور إلى WebP عند الرفع (في المتصفح قبل الحفظ على GitHub)
# حسب توثيق Sveltia: المفتاح all هو الأساس + default.config للتوافق
media_libraries:
  all:
    max_file_size: 15728640
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 82
        width: 1600
        height: 1600
      jpeg:
        format: webp
        quality: 82
        width: 1600
        height: 1600
      png:
        format: webp
        quality: 82
        width: 1600
        height: 1600
      heic:
        format: webp
        quality: 80
        width: 1600
        height: 1600
      svg:
        optimize: true
  default:
    config:
      max_file_size: 15728640
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600
        jpeg:
          format: webp
          quality: 82
          width: 1600
          height: 1600
        png:
          format: webp
          quality: 82
          width: 1600
          height: 1600
        heic:
          format: webp
          quality: 80
          width: 1600
          height: 1600
        svg:
          optimize: true

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"

    fields:
      - label: "اسم المنتج / الكوليكشن"
        name: "title"
        widget: "string"

      - label: "القسم الرئيسي"
        name: "category"
        widget: "select"
        options:
          - label: "👧🏻 Kids 🧑🏻"
            value: "Kids"
          - label: "Baby 👶🏻"
            value: "Baby"
          - label: "👨🏻 Mr & Mrs 👩🏻"
            value: "Mr & Mrs"
          - label: "💥 العروض 🔥"
            value: "عروض"
        default: "Kids"

      - label: "نوع الملابس"
        name: "subcategory"
        widget: "select"
        options:
          - label: "ملابس للمنزل"
            value: "ملابس للمنزل"
          - label: "ملابس للخروج"
            value: "ملابس للخروج"
        required: false

      - label: "صور الكوليكشن"
        name: "images"
        widget: "image"
        multiple: true
        required: true
        min: 1
        max: 15
        media_libraries:
          all:
            transformations:
              raster_image:
                format: webp
                quality: 82
                width: 1600
                height: 1600
              jpeg:
                format: webp
                quality: 82
                width: 1600
                height: 1600
              png:
                format: webp
                quality: 82
                width: 1600
                height: 1600
          default:
            config:
              multiple: true
              transformations:
                raster_image:
                  format: webp
                  quality: 82
                  width: 1600
                  height: 1600
                jpeg:
                  format: webp
                  quality: 82
                  width: 1600
                  height: 1600
                png:
                  format: webp
                  quality: 82
                  width: 1600
                  height: 1600

      - label: "السعر الأساسي (ج.م)"
        name: "price"
        widget: "number"
        value_type: "int"
        min: 0

      - label: "السعر القديم قبل الخصم (اختياري)"
        name: "oldPrice"
        widget: "number"
        value_type: "int"
        min: 0
        required: false

      - label: "حالة المخزون العامة"
        name: "stock"
        widget: "select"
        options:
          - label: "متوفر"
            value: "available"
          - label: "كمية قليلة"
            value: "low"
          - label: "نفد"
            value: "out"
        default: "available"

      - label: "جدول المقاسات"
        name: "variants"
        widget: "size-table"
        required: false

      - label: "وصف وتفاصيل المنتج"
        name: "body"
        widget: "markdown"
        required: false
