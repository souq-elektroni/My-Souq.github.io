backend:
  name: github
  repo: souq-elektroni/My-Souq.github.io
  branch: main
  auth_methods: [oauth]
  base_url: https://sveltia-cms-auth.ahmedaly1g.workers.dev

publish_mode: simple

media_folder: "images/products"
public_folder: "/images/products"

media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"

    fields:
      - label: "اسم المنتج / الكوليكشن"
        name: "title"
        widget: "string"

      - label: "القسم"
        name: "category"
        widget: "select"
        options:
          - "ملابس شتوية"
          - "ملابس خروج"
          - "أحذية"
          - "عروض"
        default: "ملابس شتوية"

      - label: "صور الكوليكشن"
        name: "images"
        widget: "image"
        multiple: true
        required: true
        min: 1
        max: 15
        media_library:
          config:
            multiple: true

      - label: "السعر الأساسي (ج.م)"
        name: "price"
        widget: "number"
        value_type: "int"
        min: 0

      - label: "السعر القديم قبل الخصم (اختياري)"
        name: "oldPrice"
        widget: "number"
        value_type: "int"
        min: 0
        required: false

      - label: "حالة المخزون العامة"
        name: "stock"
        widget: "select"
        options:
          - label: "متوفر"
            value: "available"
          - label: "كمية قليلة"
            value: "low"
          - label: "نفد"
            value: "out"
        default: "available"

      - label: "جدول المقاسات"
        name: "variants"
        widget: "size-table"
        required: false

      - label: "وصف وتفاصيل المنتج"
        name: "body"
        widget: "markdown"
        required: false
