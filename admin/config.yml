backend:
  name: github
  repo: souq-elektroni/My-Souq.github.io
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { label: "السعر", name: "price", widget: "string" }
      - { label: "المقاسات (افصل بينها بفصلة مثلاً: L, XL, XXL)", name: "sizes", widget: "string", default: "M, L, XL" }
      - { label: "طول المنتج (سم)", name: "length", widget: "string", required: false }
      - { label: "عرض المنتج (سم)", name: "width", widget: "string", required: false }
      - { label: "الصورة", name: "image", widget: "image" }
      - { label: "الوصف", name: "body", widget: "markdown" }
