backend:
  name: github
  repo: souq-elektroni/My-Souq.github.io
  branch: main

publish_mode: simple

media_folder: "images"
public_folder: "images"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { 
          label: "قسم / تصنيف المنتج", 
          name: "category", 
          widget: "select", 
          options: [
            "الكل",
            "ملابس شتوية",
            "ملابس خروج",
            "أحذية",
            "عروض"
          ], 
          default: "ملابس شتوية"
        }
      - { 
          label: "ألبوم صور المنتج", 
          name: "images", 
          widget: "list"
        }
      - { label: "السعر الأساسي (ج.م)", name: "price", widget: "number", value_type: "float" }
      - { label: "السعر القديم قبل الخصم (اختياري)", name: "oldPrice", widget: "number", value_type: "float", required: false }
      - { 
          label: "حالة المخزون العامة للمنتج", 
          name: "stock", 
          widget: "select", 
          options: [
            "available", 
            "low", 
            "out"
          ], 
          default: "available"
        }
      - { 
          label: "المقاسات المتاحة (كل مقاس في كارت منفصل)", 
          name: "variants", 
          widget: "list", 
          required: false,
          fields: [
            { 
              label: "قيمة المقاس (مثلاً: 1M، أو 3 سنوات، أو L)", 
              name: "size_value", 
              widget: "string", 
              required: true,
              hint: "اكتب المقاس مباشرة هنا ليكون عنواناً واضحاً لكل نوت (مثل: 1M أو 3 سنوات أو XL)"
            },
            { label: "السعر لهذا المقاس (اختياري)", name: "price", widget: "number", value_type: "float", required: false },
            { label: "طول البنطلون", name: "pants_length", widget: "string", required: false, default: "None" },
            { label: "طول التيشرت", name: "tshirt_length", widget: "string", required: false, default: "None" },
            { label: "عرض التيشرت", name: "tshirt_width", widget: "string", required: false, default: "None" },
            { label: "طول وعرض القطعة الإضافية", name: "extra_piece", widget: "string", required: false, default: "None" },
            { 
              label: "حالة هذا المقاس", 
              name: "status", 
              widget: "select", 
              options: [
                "available", 
                "out"
              ], 
              default: "available"
            }
          ]
        }
      - { label: "وصف وتفاصيل المنتج", name: "body", widget: "markdown" }
