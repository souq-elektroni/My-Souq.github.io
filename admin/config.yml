backend:
  name: github
  repo: souq-elektroni/My-Souq.github.io
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { label: "الصورة الرئيسية", name: "image", widget: "image" }
      - label: "صور إضافية للأشكال/الألوان", name: "images", widget: "list", required: false, field: { label: "الصورة", name: "image", widget: "image" }
      - { label: "السعر الأساسي (ج.م)", name: "price", widget: "number", value_type: "int", default: 0 }
      - label: "المقاسات والأبعاد (Variants)"
        name: "variants"
        widget: "list"
        required: false
        fields:
          - { label: "المقاس (مثال: M, L, XL, 2)", name: "size", widget: "string" }
          - { label: "السعر لهذا المقاس (ج.م)", name: "price", widget: "number", value_type: "int", required: false }
          - { label: "الطول (سم)", name: "length", widget: "string", required: false }
          - { label: "العرض (سم)", name: "width", widget: "string", required: false }
      - { label: "وصف المنتج", name: "body", widget: "markdown", required: false }
