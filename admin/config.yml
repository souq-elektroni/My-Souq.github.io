backend:
  name: github
  repo: souq-elektroni/My-Souq.github.io
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { label: "الصورة", name: "image", widget: "image" }
      - { label: "الوصف", name: "body", widget: "markdown", required: false }
      
      # جدول المقاسات بأسعارها وأبعادها
      - label: "المقاسات المتاحة وتفاصيلها"
        name: "variants"
        widget: "list"
        summary: "مقاس: {{fields.size}} - السعر: {{fields.price}} ج.م"
        fields:
          - { label: "اسم المقاس (مثال: مقاس 2 أو L)", name: "size", widget: "string" }
          - { label: "السعر لهذا المقاس", name: "price", widget: "string" }
          - { label: "الطول (سم)", name: "length", widget: "string", required: false }
          - { label: "العرض (سم)", name: "width", widget: "string", required: false }
