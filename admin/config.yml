backend:
  name: github
  repo: souq-elektroni/My-Souq.github.io
  branch: main

publish_mode: simple

media_folder: "images"
public_folder: "images"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { 
          label: "قسم / تصنيف المنتج", 
          name: "category", 
          widget: "select", 
          options: [
            "الكل",
            "ملابس شتوية",
            "ملابس خروج",
            "أحذية",
            "عروض"
          ], 
          default: "ملابس شتوية"
        }
      - { 
          label: "ألبوم صور المنتج", 
          name: "images", 
          widget: "list"
        }
      - { label: "السعر الأساسي (ج.م)", name: "price", widget: "number", value_type: "float" }
      - { label: "السعر القديم قبل الخصم (اختياري)", name: "oldPrice", widget: "number", value_type: "float", required: false }
      - { 
          label: "حالة المخزون العامة للمنتج", 
          name: "stock", 
          widget: "select", 
          options: [
            "available", 
            "low", 
            "out"
          ], 
          default: "available"
        }
      - { 
          label: "المقاسات المتاحة", 
          name: "variants", 
          widget: "list", 
          required: false,
          summary: "{{fields.size}} - {{fields.status}}",
          fields: [
            { 
              label: "المقاس", 
              name: "size", 
              widget: "select", 
              options: [
                "0M", "1M", "3M", "6M", "9M", "12M", "18M", "24M",
                "1 سنة", "2 سنة", "3 سنة", "4 سنة", "5 سنة", "6 سنة",
                "7 سنة", "8 سنة", "9 سنة", "10 سنة", "11 سنة", "12 سنة",
                "13 سنة", "14 سنة", "15 سنة", "16 سنة", "17 سنة", "18 سنة", "19 سنة", "20 سنة",
                "M", "L", "XL", "2XL", "3XL", "4XL", "5XL", "6XL"
              ],
              required: true
            },
            { label: "السعر لهذا المقاس (اختياري)", name: "price", widget: "number", value_type: "float", required: false },
            { label: "طول البنطلون", name: "pants_length", widget: "string", required: false },
            { label: "طول التيشرت", name: "tshirt_length", widget: "string", required: false },
            { label: "عرض التيشرت", name: "tshirt_width", widget: "string", required: false },
            { label: "طول وعرض القطعة الإضافية", name: "extra_piece", widget: "string", required: false },
            { 
              label: "حالة هذا المقاس", 
              name: "status", 
              widget: "select", 
              options: [
                "available", 
                "out"
              ], 
              default: "available"
            }
          ]
        }
      - { label: "وصف وتفاصيل المنتج", name: "body", widget: "markdown" }
