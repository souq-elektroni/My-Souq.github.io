
backend:
  name: github
  repo: souq-elektroni/My-Souq.github.io
  branch: main
  auth_methods: [oauth]
  base_url: https://sveltia-cms-auth.ahmedaly1g.workers.dev

# نشر مباشر بدون نظام المسودات والمراجعات
publish_mode: simple

media_folder: "images/products"
public_folder: "/images/products"

# إعدادات الصور العامة
media_libraries:
  all:
    max_file_size: 52428800
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 50
        width: 1000
        height: 1000
      jpeg:
        format: webp
        quality: 50
        width: 1000
        height: 1000
      png:
        format: webp
        quality: 50
        width: 1000
        height: 1000
      heic:
        format: webp
        quality: 50
        width: 1000
        height: 1000
      svg:
        optimize: true

  default:
    config:
      max_file_size: 52428800
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 50
          width: 1000
          height: 1000
        jpeg:
          format: webp
          quality: 50
          width: 1000
          height: 1000
        png:
          format: webp
          quality: 50
          width: 1000
          height: 1000
        heic:
          format: webp
          quality: 50
          width: 1000
          height: 1000
        svg:
          optimize: true

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"

    fields:
      - label: "اسم المنتج / الكوليكشن"
        name: "title"
        widget: "string"

      - label: "القسم الرئيسي"
        name: "category"
        widget: "select"
        options:
          - label: "👧🏻 Kids 🧑🏻"
            value: "Kids"
          - label: "Baby 👶🏻"
            value: "Baby"
          - label: "👨🏻 Mr & Mrs 👩🏻"
            value: "Mr & Mrs"
          - label: "💥 العروض 🔥"
            value: "عروض"
        default: "Kids"

      # نوع الملابس مطلوب عند إنشاء المنتج
      - label: "نوع الملابس"
        name: "subcategory"
        widget: "select"
        options:
          - label: "ملابس للمنزل"
            value: "ملابس للمنزل"
          - label: "ملابس للخروج"
            value: "ملابس للخروج"
        required: true

      - label: "صور الكوليكشن"
        name: "images"
        widget: "image"
        multiple: true
        required: true
        min: 1
        max: 200
        media_libraries:
          all:
            max_file_size: 52428800
            transformations:
              raster_image:
                format: webp
                quality: 50
                width: 1000
                height: 1000
              jpeg:
                format: webp
                quality: 50
                width: 1000
                height: 1000
              png:
                format: webp
                quality: 50
                width: 1000
                height: 1000
              heic:
                format: webp
                quality: 50
                width: 1000
                height: 1000
          default:
            config:
              multiple: true
              max_file_size: 52428800
              transformations:
                raster_image:
                  format: webp
                  quality: 50
                  width: 1000
                  height: 1000
                jpeg:
                  format: webp
                  quality: 50
                  width: 1000
                  height: 1000
                png:
                  format: webp
                  quality: 50
                  width: 1000
                  height: 1000
                heic:
                  format: webp
                  quality: 50
                  width: 1000
                  height: 1000

      - label: "السعر الأساسي (ج.م)"
        name: "price"
        widget: "number"
        value_type: "int"
        min: 0

      - label: "السعر القديم قبل الخصم (اختياري)"
        name: "oldPrice"
        widget: "number"
        value_type: "int"
        min: 0
        required: false

      - label: "حالة المخزون العامة"
        name: "stock"
        widget: "select"
        options:
          - label: "متوفر"
            value: "available"
          - label: "كمية قليلة"
            value: "low"
          - label: "نفد"
            value: "out"
        default: "available"

      - label: "جدول المقاسات"
        name: "variants"
        widget: "size-table"
        required: false

      - label: "وصف وتفاصيل المنتج"
        name: "body"
        widget: "markdown"
        required: false
