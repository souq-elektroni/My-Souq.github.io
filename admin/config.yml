backend:
  name: github
  repo: souq-elektroni/My-Souq.github.io
  branch: main

publish_mode: simple

media_folder: "images"
public_folder: "images"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { 
          label: "قسم / تصنيف المنتج", 
          name: "category", 
          widget: "select", 
          options: [
            "الكل",
            "ملابس شتوية",
            "ملابس خروج",
            "أحذية",
            "عروض"
          ], 
          default: "ملابس شتوية"
        }
      - { 
          label: "ألبوم صور المنتج", 
          name: "images", 
          widget: "list"
        }
      - { label: "السعر الأساسي (ج.م)", name: "price", widget: "number", value_type: "float" }
      - { label: "السعر القديم قبل الخصم (اختياري)", name: "oldPrice", widget: "number", value_type: "float", required: false }
      - { 
          label: "حالة المخزون العامة للمنتج", 
          name: "stock", 
          widget: "select", 
          options: [
            "available", 
            "low", 
            "out"
          ], 
          default: "available"
        }
      - { 
          label: "المقاسات المتاحة", 
          name: "variants", 
          widget: "list", 
          required: false,
          fields: [
            { label: "المقاس (مثال: 2، أو S، أو M)", name: "size", widget: "string" },
            { label: "السعر لهذا المقاس (اختياري)", name: "price", widget: "number", value_type: "float", required: false },
            { label: "الطول (سم)", name: "length", widget: "string", required: false },
            { label: "العرض (سم)", name: "width", widget: "string", required: false },
            { 
              label: "حالة هذا المقاس", 
              name: "status", 
              widget: "select", 
              options: [
                "available", 
                "out"
              ], 
              default: "available"
            }
          ]
        }
      - { label: "وصف وتفاصيل المنتج", name: "body", widget: "markdown" }
