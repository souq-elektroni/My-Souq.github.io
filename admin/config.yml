backend:
  name: github
  repo: souq-elektroni/My-Souq.github.io
  branch: main

publish_mode: simple

media_folder: "images"
public_folder: "images"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { 
          label: "قسم / تصنيف المنتج", 
          name: "category", 
          widget: "select", 
          options: [
            "الكل",
            "ملابس شتوية",
            "ملابس خروج",
            "أحذية",
            "عروض"
          ], 
          default: "ملابس شتوية"
        }
      - { 
          label: "ألبوم صور المنتج (الصورة الأولى AU، الثانية BU، الثالثة CU... وهكذا تلقائياً)", 
          name: "images", 
          widget: "list"
        }
      - { label: "السعر الأساسي (ج.م)", name: "price", widget: "number", value_type: "float" }
      - { label: "السعر القديم قبل الخصم (اختياري)", name: "oldPrice", widget: "number", value_type: "float", required: false }
      - { 
          label: "حالة المخزون العامة للمنتج", 
          name: "stock", 
          widget: "select", 
          options: [
            "available", 
            "low", 
            "out"
          ], 
          default: "available"
        }
      - { 
          label: "المقاسات وحالة المخزون لكل كود صورة", 
          name: "variants", 
          widget: "list", 
          required: false,
          fields: [
            { label: "المقاس (مثال: 2، 3، 4)", name: "size", widget: "string" },
            { 
              label: "كود الصورة المرتبطة (AU للصورة الأولى، BU للثانية، وهكذا)", 
              name: "code", 
              widget: "select",
              options: [
                "none", "AU", "BU", "CU", "DU", "EU", "FU", "GU", "HU", "IU", "JU",
                "KU", "LU", "MU", "NU", "OU", "PU", "QU", "RU", "SU", "TU",
                "UU", "VU", "WU", "XU", "YU", "ZU"
              ],
              default: "none"
            },
            { label: "السعر (اختياري)", name: "price", widget: "number", value_type: "float", required: false },
            { label: "الطول (سم)", name: "length", widget: "string", required: false },
            { label: "العرض (سم)", name: "width", widget: "string", required: false },
            { 
              label: "حالة هذا المقاس لهذا الكود فقط", 
              name: "status", 
              widget: "select", 
              options: [
                "available", 
                "out"
              ], 
              default: "available"
            }
          ]
        }
      - { label: "وصف وتفاصيل المنتج", name: "body", widget: "markdown" }
