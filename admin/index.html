<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#803d48" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="My Souq Admin" />
    <title>لوحة إدارة المنتجات - My Souq</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #fdfbf7;
      }

      #loading {
        display: grid;
        place-items: center;
        height: 100vh;
        color: #803d48;
        font-weight: bold;
        font-size: 18px;
      }
    </style>

    <style id="my-souq-size-table-style">
      .my-souq-size-table-wrap {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border: 1px solid #e3ddd6;
        border-radius: 12px;
        background: #fff;
        margin-top: 8px;
      }

      .my-souq-size-table {
        width: 100%;
        min-width: 1250px;
        border-collapse: collapse;
        direction: rtl;
        font-family: Arial, sans-serif;
      }

      .my-souq-size-table th,
      .my-souq-size-table td {
        border-bottom: 1px solid #eee7df;
        border-left: 1px solid #eee7df;
        padding: 7px;
        vertical-align: middle;
        text-align: center;
      }

      .my-souq-size-table th {
        background: #803d48;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .my-souq-size-table td {
        background: #fff;
      }

      .my-souq-size-table tr:last-child td {
        border-bottom: 0;
      }

      .my-souq-size-table input,
      .my-souq-size-table select {
        box-sizing: border-box;
        width: 100%;
        min-height: 38px;
        border: 1px solid #d8d0c8;
        border-radius: 7px;
        background: #fff;
        padding: 7px 8px;
        font-size: 13px;
        color: #333;
        outline: none;
      }

      .my-souq-size-table input:focus,
      .my-souq-size-table select:focus {
        border-color: #803d48;
        box-shadow: 0 0 0 2px rgba(128, 61, 72, 0.10);
      }

      .my-souq-size-table .mst-size {
        min-width: 125px;
      }

      .my-souq-size-table .mst-color {
        min-width: 110px;
      }

      .my-souq-size-table .mst-number {
        min-width: 105px;
      }

      .my-souq-size-table .mst-extra {
        min-width: 180px;
      }

      .my-souq-size-table .mst-price {
        min-width: 120px;
      }

      .my-souq-size-table .mst-quantity {
        min-width: 105px;
      }

      .my-souq-size-table .mst-status {
        min-width: 120px;
      }

      .my-souq-size-table .mst-actions {
        min-width: 75px;
      }

      .my-souq-size-table .mst-delete {
        border: 0;
        border-radius: 7px;
        min-height: 38px;
        padding: 7px 10px;
        background: #f7e7e7;
        color: #a32626;
        cursor: pointer;
        font-weight: 700;
      }

      .my-souq-size-table .mst-delete:hover {
        background: #efd3d3;
      }

      .my-souq-size-table-add {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 10px;
        min-height: 42px;
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        background: #803d48;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
      }

      .my-souq-size-table-add:hover {
        filter: brightness(0.95);
      }

      .my-souq-size-table-empty {
        padding: 18px;
        text-align: center;
        color: #777;
        font-size: 13px;
      }

      .my-souq-size-table-note {
        margin-top: 7px;
        color: #777;
        font-size: 12px;
        line-height: 1.6;
      }
    </style>


  </head>

  <body>
    <div id="loading">
      جاري تحميل لوحة إدارة My Souq...
    </div>


      <!-- Prevent auto-init so the custom size-table field is registered synchronously first. -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <script>
      /*
       * My Souq - Sveltia Custom Field: size-table
       * Keeps the existing "variants" data structure as an array of objects.
       * Quantity and status are independent; changing quantity never changes status.
       */
      (function () {
        function registerSizeTable() {
          if (!window.CMS || !window.createClass || !window.h) {
            return false;
          }

          if (window.__MY_SOUQ_SIZE_TABLE_REGISTERED__) {
            return true;
          }

          const h = window.h;
          const createClass = window.createClass;

          const SIZE_OPTIONS = [
            "مقاس موحد",
            "0M",
            "1M",
            "3M",
            "6M",
            "9M",
            "12M",
            "18M",
            "24M",
            "1 سنة",
            "2 سنة",
            "3 سنة",
            "4 سنة",
            "5 سنة",
            "6 سنة",
            "7 سنة",
            "8 سنة",
            "9 سنة",
            "10 سنة",
            "11 سنة",
            "12 سنة",
            "13 سنة",
            "14 سنة",
            "15 سنة",
            "16 سنة",
            "17 سنة",
            "18 سنة",
            "19 سنة",
            "20 سنة",
            "M",
            "L",
            "XL",
            "2XL",
            "3XL",
            "4XL",
            "5XL",
            "6XL"
          ];

          const STATUS_OPTIONS = [
            {
              label: "متوفر",
              value: "available"
            },
            {
              label: "نفد",
              value: "out"
            }
          ];

          /*
           * Sveltia may pass field values as Immutable collections during
           * entry updates. The old code accepted Array only, so after typing
           * or clicking another field it could turn a valid variants list
           * into [] and the table disappeared.
           *
           * Convert Array / Immutable List / array-like values to plain JS
           * without changing the stored variants schema.
           */
          const toPlainArray = function (value) {
            if (Array.isArray(value)) {
              return value;
            }

            if (value && typeof value.toJS === "function") {
              const converted = value.toJS();
              return Array.isArray(converted) ? converted : [];
            }

            if (value && typeof value.toArray === "function") {
              return value.toArray().map(function (item) {
                if (item && typeof item.toJS === "function") {
                  return item.toJS();
                }
                return item;
              });
            }

            return [];
          };

          const normalizeRows = function (value) {
            return toPlainArray(value).map(function (row) {
              return Object.assign(
                {
                  size: "",
                  color: "",
                  price: null,
                  quantity: 0,
                  pants_length: "",
                  tshirt_length: "",
                  tshirt_width: "",
                  extra_piece: "",
                  status: "available"
                },
                row && typeof row.toJS === "function"
                  ? row.toJS()
                  : (row || {})
              );
            });
          };

          const stableJSON = function (value) {
            try {
              return JSON.stringify(value || []);
            } catch (e) {
              return "[]";
            }
          };

          const SizeTableControl = createClass({
            getInitialState: function () {
              return {
                rows: normalizeRows(this.props.value),
                dirty: false,
                lastEmitted: null
              };
            },

            componentWillReceiveProps: function (nextProps) {
              const incoming = normalizeRows(nextProps.value);
              const incomingJSON = stableJSON(incoming);

              /*
               * IMPORTANT:
               * Sveltia may re-render this control while the entry draft is
               * being updated. During that short cycle the value can briefly
               * be empty/old. Never replace the user's visible rows with that
               * transient value while we have a local edit waiting to settle.
               */
              if (this.state.dirty) {
                if (incomingJSON === this.state.lastEmitted) {
                  this.setState({
                    rows: incoming,
                    dirty: false,
                    lastEmitted: null
                  });
                }
                return;
              }

              this.setState({ rows: incoming });
            },

            emitRows: function (rows) {
              const plainRows = normalizeRows(rows);
              const emittedJSON = stableJSON(plainRows);

              this.setState({
                rows: plainRows,
                dirty: true,
                lastEmitted: emittedJSON
              });

              /* Sveltia's custom field API accepts the new field value here. */
              this.props.onChange(plainRows);
            },

            handleChange: function (index, field, rawValue) {
              const rows = this.state.rows.map(function (row) {
                return Object.assign({}, row);
              });

              if (!rows[index]) {
                return;
              }

              if (field === "quantity" || field === "price") {
                if (rawValue === "") {
                  rows[index][field] = null;
                } else {
                  const numberValue = Number(rawValue);
                  rows[index][field] = Number.isFinite(numberValue)
                    ? numberValue
                    : null;
                }
              } else {
                rows[index][field] = rawValue;
              }

              this.emitRows(rows);
            },

            addRow: function () {
              const rows = this.state.rows.map(function (row) {
                return Object.assign({}, row);
              });

              rows.push({
                size: "",
                color: "",
                price: null,
                quantity: 0,
                pants_length: "",
                tshirt_length: "",
                tshirt_width: "",
                extra_piece: "",
                status: "available"
              });

              this.emitRows(rows);
            },

            deleteRow: function (index) {
              const rows = this.state.rows.map(function (row) {
                return Object.assign({}, row);
              });

              rows.splice(index, 1);
              this.emitRows(rows);
            },

            renderInput: function (row, index, field, type, className) {
              const value = row[field] == null ? "" : row[field];

              return h("input", {
                type: type || "text",
                className: className || "",
                value: value,
                min: type === "number" ? 0 : undefined,
                step: type === "number" ? 1 : undefined,
                onChange: function (event) {
                  this.handleChange(index, field, event.target.value);
                }.bind(this)
              });
            },

            renderSizeSelect: function (row, index) {
              return h(
                "select",
                {
                  className: "mst-size",
                  value: row.size || "",
                  onChange: function (event) {
                    this.handleChange(index, "size", event.target.value);
                  }.bind(this)
                },
                h("option", { value: "" }, "اختر المقاس"),
                SIZE_OPTIONS.map(function (size) {
                  return h("option", { key: size, value: size }, size);
                })
              );
            },

            renderStatusSelect: function (row, index) {
              return h(
                "select",
                {
                  className: "mst-status",
                  value: row.status || "available",
                  onChange: function (event) {
                    this.handleChange(index, "status", event.target.value);
                  }.bind(this)
                },
                STATUS_OPTIONS.map(function (status) {
                  return h("option", { key: status.value, value: status.value }, status.label);
                })
              );
            },

            render: function () {
              const rows = this.state.rows;

              return h(
                "div",
                { style: { width: "100%" } },
                h(
                  "div",
                  { className: "my-souq-size-table-wrap" },
                  h(
                    "table",
                    { className: "my-souq-size-table" },
                    h(
                      "thead",
                      {},
                      h(
                        "tr",
                        {},
                        h("th", { className: "mst-size" }, "المقاس"),
                        h("th", { className: "mst-color" }, "اللون"),
                        h("th", { className: "mst-number" }, "طول البنطلون"),
                        h("th", { className: "mst-number" }, "طول التيشرت"),
                        h("th", { className: "mst-number" }, "عرض التيشرت"),
                        h("th", { className: "mst-extra" }, "طول وعرض القطعة الإضافية"),
                        h("th", { className: "mst-price" }, "سعر هذا المقاس"),
                        h("th", { className: "mst-quantity" }, "الكمية المتاحة"),
                        h("th", { className: "mst-status" }, "حالة هذا المقاس"),
                        h("th", { className: "mst-actions" }, "حذف")
                      )
                    ),
                    h(
                      "tbody",
                      {},
                      rows.length
                        ? rows.map(function (row, index) {
                            return h(
                              "tr",
                              { key: "mst-row-" + index },
                              h("td", {}, this.renderSizeSelect(row, index)),
                              h("td", {}, this.renderInput(row, index, "color", "text", "mst-color")),
                              h("td", {}, this.renderInput(row, index, "pants_length", "text", "mst-number")),
                              h("td", {}, this.renderInput(row, index, "tshirt_length", "text", "mst-number")),
                              h("td", {}, this.renderInput(row, index, "tshirt_width", "text", "mst-number")),
                              h("td", {}, this.renderInput(row, index, "extra_piece", "text", "mst-extra")),
                              h("td", {}, this.renderInput(row, index, "price", "number", "mst-price")),
                              h("td", {}, this.renderInput(row, index, "quantity", "number", "mst-quantity")),
                              h("td", {}, this.renderStatusSelect(row, index)),
                              h(
                                "td",
                                {},
                                h(
                                  "button",
                                  {
                                    type: "button",
                                    className: "mst-delete",
                                    onClick: function () {
                                      this.deleteRow(index);
                                    }.bind(this)
                                  },
                                  "حذف"
                                )
                              )
                            );
                          }, this)
                        : h(
                            "tr",
                            {},
                            h(
                              "td",
                              { colSpan: 10, className: "my-souq-size-table-empty" },
                              "لا توجد مقاسات بعد — اضغط «＋ إضافة مقاس» لإضافة أول صف."
                            )
                          )
                    )
                  )
                ),
                h(
                  "button",
                  {
                    type: "button",
                    className: "my-souq-size-table-add",
                    onMouseDown: function (event) {
                      /* Keep focus inside the custom field; do not let the
                         CMS treat the button click as a field blur. */
                      event.preventDefault();
                    },
                    onClick: function (event) {
                      event.preventDefault();
                      event.stopPropagation();
                      this.addRow();
                    }.bind(this)
                  },
                  "＋ إضافة مقاس"
                ),
                h(
                  "div",
                  { className: "my-souq-size-table-note" },
                  "يمكنك تعديل كل صف بشكل مستقل. تغيير أي حقل آخر في المنتج لن يمسح صفوف المقاسات."
                )
              );
            }
          });

          const SizeTablePreview = createClass({
            render: function () {
              const rows = normalizeRows(this.props.value);

              if (!rows.length) {
                return h(
                  "div",
                  {
                    style: {
                      padding: "10px 0",
                      color: "#777"
                    }
                  },
                  "لا توجد مقاسات"
                );
              }

              const cell = function (value) {
                return value == null || value === "" ? "—" : String(value);
              };

              return h(
                "div",
                {
                  style: {
                    width: "100%",
                    overflowX: "auto",
                    direction: "rtl"
                  }
                },
                h(
                  "table",
                  {
                    style: {
                      width: "100%",
                      minWidth: "980px",
                      borderCollapse: "collapse",
                      fontSize: "12px",
                      background: "#fff"
                    }
                  },
                  h(
                    "thead",
                    {},
                    h(
                      "tr",
                      {},
                      [
                        "المقاس",
                        "اللون",
                        "طول البنطلون",
                        "طول التيشرت",
                        "عرض التيشرت",
                        "طول وعرض القطعة الإضافية",
                        "السعر",
                        "الكمية",
                        "الحالة"
                      ].map(function (label) {
                        return h(
                          "th",
                          {
                            style: {
                              padding: "7px 6px",
                              border: "1px solid #ddd",
                              background: "#803d48",
                              color: "#fff",
                              textAlign: "center",
                              whiteSpace: "nowrap"
                            }
                          },
                          label
                        );
                      })
                    )
                  ),
                  h(
                    "tbody",
                    {},
                    rows.map(function (row, index) {
                      return h(
                        "tr",
                        { key: "preview-row-" + index },
                        [
                          cell(row.size),
                          cell(row.color),
                          cell(row.pants_length),
                          cell(row.tshirt_length),
                          cell(row.tshirt_width),
                          cell(row.extra_piece),
                          cell(row.price),
                          cell(row.quantity),
                          row.status === "out" ? "نفد" : "متوفر"
                        ].map(function (value) {
                          return h(
                            "td",
                            {
                              style: {
                                padding: "7px 6px",
                                border: "1px solid #ddd",
                                textAlign: "center",
                                whiteSpace: "nowrap"
                              }
                            },
                            value
                          );
                        })
                      );
                    })
                  )
                )
              );
            }
          });

          window.CMS.registerFieldType(
            "size-table",
            SizeTableControl,
            SizeTablePreview
          );

          window.__MY_SOUQ_SIZE_TABLE_REGISTERED__ =
            true;

          return true;
        }

        // Sveltia is loaded immediately before this script and automatic
        // initialization is disabled below. Register the field synchronously
        // before loading config, then initialize the CMS.
        registerSizeTable();
        window.CMS.init();
      })();
    </script>
</body>
</html>
