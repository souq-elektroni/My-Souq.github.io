    <style id="my-souq-size-table-style">
      /* Admin page: no horizontal page scroll */
      html, body {
        max-width: 100%;
        overflow-x: hidden;
      }

      /* ===== Variants: responsive cards (no side slide) ===== */
      .my-souq-size-table-wrap {
        width: 100%;
        max-width: 100%;
        overflow: visible;
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .mst-row-card {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #e3ddd6;
        border-radius: 14px;
        background: #fff;
        padding: 12px;
        box-shadow: 0 4px 14px rgba(72, 35, 45, 0.05);
        direction: rtl;
      }

      .mst-row-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid #f0ebe6;
      }

      .mst-row-title {
        font-size: 13px;
        font-weight: 800;
        color: #803d48;
      }

      /* صف واحد يملأ العرض — بدون سحب أفقي */
      .mst-fields-grid {
        display: grid;
        grid-template-columns: repeat(9, minmax(0, 1fr));
        gap: 6px;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        align-items: end;
      }

      .mst-field {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        width: 100%;
      }

      .mst-label {
        font-size: 10px;
        font-weight: 800;
        color: #6b5a60;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.15;
      }

      .mst-field input,
      .mst-field select,
      .my-souq-size-table-wrap input,
      .my-souq-size-table-wrap select {
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 36px;
        border: 1px solid #d8d0c8;
        border-radius: 7px;
        background: #fff !important;
        color: #333 !important;
        padding: 5px 4px;
        font-size: 11.5px;
        outline: none;
        -webkit-text-fill-color: #333;
      }

      /* موبايل: نفس الـ 9 أعمدة في صف واحد بدون سكرول */
      @media (max-width: 900px) {
        .mst-row-card {
          padding: 10px 8px;
        }
        .mst-fields-grid {
          grid-template-columns: repeat(9, minmax(0, 1fr)) !important;
          gap: 4px;
          overflow: hidden !important;
        }
        .mst-label {
          font-size: 8px;
          letter-spacing: -0.2px;
        }
        .mst-field input,
        .mst-field select {
          min-height: 32px;
          font-size: 10px;
          padding: 3px 2px;
          border-radius: 6px;
        }
      }

      @media (max-width: 420px) {
        .mst-fields-grid {
          gap: 3px;
        }
        .mst-label {
          font-size: 7px;
        }
        .mst-field input,
        .mst-field select {
          min-height: 30px;
          font-size: 9px;
          padding: 2px 1px;
        }
      }

      .mst-field input:focus,
      .mst-field select:focus {
        border-color: #803d48;
        box-shadow: 0 0 0 2px rgba(128, 61, 72, 0.12);
      }

      .mst-delete {
        border: 0;
        border-radius: 9px;
        min-height: 36px;
        padding: 6px 12px;
        background: #f7e7e7;
        color: #a32626;
        cursor: pointer;
        font-weight: 800;
        font-size: 12px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .mst-delete:hover {
        background: #efd3d3;
      }

      .my-souq-size-table-add {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 4px;
        min-height: 44px;
        padding: 8px 18px;
        border: 0;
        border-radius: 10px;
        background: #803d48;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        width: 100%;
        max-width: 280px;
      }

      .my-souq-size-table-add:hover {
        filter: brightness(0.95);
      }

      .my-souq-size-table-empty {
        padding: 20px 14px;
        text-align: center;

        font-size: 13px;

      .my-souq-size-table-note {

      .mst-preview-wrap {

        background: #fff;
        font-size: 12.5px;

        color: #803d48;
      }

      <!-- Prevent auto-init so the custom size-table field is registered synchronously first. -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/@sveltia/cms@latest/dist/sveltia-cms.js"></script>

    <script>
      /*
       * My Souq - Sveltia Custom Field: size-table
       * Keeps the existing "variants" data structure as an array of objects.
       * Quantity and status are independent; changing quantity never changes status.
       */
      (function () {
        function registerSizeTable() {
          if (!window.CMS || !window.createClass || !window.h) {
            return false;
          }

          if (window.__MY_SOUQ_SIZE_TABLE_REGISTERED__) {
            return true;
          }

          const h = window.h;
          const createClass = window.createClass;

          const SIZE_OPTIONS = [
            "مقاس موحد",
            "0M",
            "1M",
            "3M",
            "6M",
            "9M",
            "12M",
            "18M",
            "24M",
            "1 سنة",
            "2 سنة",
            "3 سنة",
            "4 سنة",
            "5 سنة",
            "6 سنة",
            "7 سنة",
            "8 سنة",
            "9 سنة",
            "10 سنة",
            "11 سنة",
            "12 سنة",
            "13 سنة",
            "14 سنة",
            "15 سنة",
            "16 سنة",
            "17 سنة",
            "18 سنة",
            "19 سنة",
            "20 سنة",
            "M",
            "L",
            "XL",
            "2XL",
            "3XL",
            "4XL",
            "5XL",
            "6XL"
          ];

          const STATUS_OPTIONS = [
            {
              label: "متوفر",
              value: "available"
            },
            {
              label: "نفد",
              value: "out"
            }
          ];

          /*
           * Sveltia may pass field values as Immutable collections during
           * entry updates. The old code accepted Array only, so after typing
           * or clicking another field it could turn a valid variants list
           * into [] and the table disappeared.
           *
           * Convert Array / Immutable List / array-like values to plain JS
           * without changing the stored variants schema.
           */
          const toPlainArray = function (value) {
            if (Array.isArray(value)) {
              return value;
            }

            if (value && typeof value.toJS === "function") {
              const converted = value.toJS();
              return Array.isArray(converted) ? converted : [];
            }

            if (value && typeof value.toArray === "function") {
              return value.toArray().map(function (item) {
                if (item && typeof item.toJS === "function") {
                  return item.toJS();
                }
                return item;
              });
            }

            return [];
          };

          const normalizeRows = function (value) {
            return toPlainArray(value).map(function (row) {
              return Object.assign(
                {
                  size: "",
                  color: "",
                  price: null,
                  quantity: 0,
                  pants_length: "",
                  tshirt_length: "",
                  tshirt_width: "",
                  extra_piece: "",
                  status: "available"
                },
                row && typeof row.toJS === "function"
                  ? row.toJS()
                  : (row || {})
              );
            });
          };

          const stableJSON = function (value) {
            try {
              return JSON.stringify(value || []);
            } catch (e) {
              return "[]";
            }
          };

          const SizeTableControl = createClass({
            getInitialState: function () {
              return {
                rows: normalizeRows(this.props.value),
                dirty: false,
                lastEmitted: null
              };
            },

            componentWillReceiveProps: function (nextProps) {
              const incoming = normalizeRows(nextProps.value);
              const incomingJSON = stableJSON(incoming);

              /*
               * IMPORTANT:
               * Sveltia may re-render this control while the entry draft is
               * being updated. During that short cycle the value can briefly
               * be empty/old. Never replace the user's visible rows with that
               * transient value while we have a local edit waiting to settle.
               */
              if (this.state.dirty) {
                if (incomingJSON === this.state.lastEmitted) {
                  this.setState({
                    rows: incoming,
                    dirty: false,
                    lastEmitted: null
                  });
                }
                return;
              }

              this.setState({ rows: incoming });
            },

            emitRows: function (rows) {
              const plainRows = normalizeRows(rows);
              const emittedJSON = stableJSON(plainRows);

              this.setState({
                rows: plainRows,
                dirty: true,
                lastEmitted: emittedJSON
              });

              /* Sveltia's custom field API accepts the new field value here. */
              this.props.onChange(plainRows);
            },

            handleChange: function (index, field, rawValue) {
              const rows = this.state.rows.map(function (row) {
                return Object.assign({}, row);
              });

              if (!rows[index]) {
                return;
              }

              if (field === "quantity" || field === "price") {
                if (rawValue === "") {
                  rows[index][field] = null;
                } else {
                  const numberValue = Number(rawValue);
                  rows[index][field] = Number.isFinite(numberValue)
                    ? numberValue
                    : null;
                }
              } else {
                rows[index][field] = rawValue;
              }

              this.emitRows(rows);
            },

            addRow: function () {
              const rows = this.state.rows.map(function (row) {
                return Object.assign({}, row);
              });

              rows.push({
                size: "",
                color: "",
                price: null,
                quantity: 0,
                pants_length: "",
                tshirt_length: "",
                tshirt_width: "",
                extra_piece: "",
                status: "available"
              });

              this.emitRows(rows);
            },

            deleteRow: function (index) {
              const rows = this.state.rows.map(function (row) {
                return Object.assign({}, row);
              });

              rows.splice(index, 1);
              this.emitRows(rows);
            },

            renderInput: function (row, index, field, type, className) {
              const value = row[field] == null ? "" : row[field];

              return h("input", {
                type: type || "text",
                className: className || "",
                value: value,
                min: type === "number" ? 0 : undefined,
                step: type === "number" ? 1 : undefined,
                onChange: function (event) {
                  this.handleChange(index, field, event.target.value);
                }.bind(this)
              });
            },

            renderSizeSelect: function (row, index) {
              return h(
                "select",
                {
                  className: "mst-size",
                  value: row.size || "",
                  onChange: function (event) {
                    this.handleChange(index, "size", event.target.value);
                  }.bind(this)
                },
                h("option", { value: "" }, "اختر المقاس"),
                SIZE_OPTIONS.map(function (size) {
                  return h("option", { key: size, value: size }, size);
                })
              );
            },

            renderStatusSelect: function (row, index) {
              return h(
                "select",
                {
                  className: "mst-status",
                  value: row.status || "available",
                  onChange: function (event) {
                    this.handleChange(index, "status", event.target.value);
                  }.bind(this)
                },
                STATUS_OPTIONS.map(function (status) {
                  return h("option", { key: status.value, value: status.value }, status.label);
                })
              );
            },

            renderField: function (label, control, span2) {
              return h(
                "div",
                { className: "mst-field" + (span2 ? " mst-span-2" : "") },
                h("label", { className: "mst-label" }, label),
                control
              );
            },

            render: function () {
              const rows = this.state.rows;
              const self = this;

              return h(
                "div",
                { style: { width: "100%", maxWidth: "100%" } },
                h(
                  "div",
                  { className: "my-souq-size-table-wrap" },
                  rows.length
                    ? rows.map(function (row, index) {
                        return h(
                          "div",
                          { className: "mst-row-card", key: "mst-row-" + index },
                          h(
                            "div",
                            { className: "mst-row-header" },
                            h(
                              "div",
                              { className: "mst-row-title" },
                              "مقاس #" + (index + 1) + (row.size ? " — " + row.size : "")
                            ),
                            h(
                              "button",
                              {
                                type: "button",
                                className: "mst-delete",
                                onClick: function () {
                                  self.deleteRow(index);
                                }
                              },
                              "حذف"
                            )
                          ),
                          h(
                            "div",
                            { className: "mst-fields-grid" },
                            self.renderField("المقاس", self.renderSizeSelect(row, index)),
                            self.renderField("اللون", self.renderInput(row, index, "color", "text", "mst-color")),
                            self.renderField("بنطلون", self.renderInput(row, index, "pants_length", "text", "mst-number")),
                            self.renderField("تيشرت ط", self.renderInput(row, index, "tshirt_length", "text", "mst-number")),
                            self.renderField("تيشرت ع", self.renderInput(row, index, "tshirt_width", "text", "mst-number")),
                            self.renderField("إضافي", self.renderInput(row, index, "extra_piece", "text", "mst-extra")),
                            self.renderField("السعر", self.renderInput(row, index, "price", "number", "mst-price")),
                            self.renderField("الكمية", self.renderInput(row, index, "quantity", "number", "mst-quantity")),
                            self.renderField("الحالة", self.renderStatusSelect(row, index))
                          )
                        );
                      })
                    : h(
                        "div",
                        { className: "my-souq-size-table-empty" },
                        "لا توجد مقاسات بعد — اضغط «＋ إضافة مقاس» لإضافة أول صف."
                      )
                ),
                h(
                  "button",
                  {
                    type: "button",
                    className: "my-souq-size-table-add",
                    onMouseDown: function (event) {
                      /* Keep focus inside the custom field; do not let the
                         CMS treat the button click as a field blur. */
                      event.preventDefault();
                    },
                    onClick: function (event) {
                      event.preventDefault();
                      event.stopPropagation();
                      this.addRow();
                    }.bind(this)
                  },
                  "＋ إضافة مقاس"
                ),
                h(
                  "div",
                  { className: "my-souq-size-table-note" },
                  "كل الخانات ظاهرة بدون تمرير جانبي على الموبايل والكمبيوتر. يمكنك تعديل كل صف بشكل مستقل."
                )
              );
            }
          });

          const SizeTablePreview = createClass({
            render: function () {
              const rows = normalizeRows(this.props.value);

              if (!rows.length) {
                return h(
                  "div",
                  {
                    style: {
                      padding: "10px 0",
                      color: "#777"
                    }
                  },
                  "لا توجد مقاسات"
                );
              }

              const cell = function (value) {
                return value == null || value === "" ? "—" : String(value);
              };

              return h(
                "div",
                { className: "mst-preview-wrap" },
                rows.map(function (row, index) {
                  return h(
                    "div",
                    { className: "mst-preview-card", key: "preview-row-" + index },
                    h("div", {}, h("strong", {}, "المقاس: "), cell(row.size),
                      " · ", h("strong", {}, "اللون: "), cell(row.color)),
                    h("div", {},
                      h("strong", {}, "بنطلون: "), cell(row.pants_length),
                      " · ", h("strong", {}, "تيشرت ط: "), cell(row.tshirt_length),
                      " · ", h("strong", {}, "تيشرت ع: "), cell(row.tshirt_width)
                    ),
                    h("div", {}, h("strong", {}, "إضافي: "), cell(row.extra_piece)),
                    h("div", {},
                      h("strong", {}, "السعر: "), cell(row.price),
                      " · ", h("strong", {}, "الكمية: "), cell(row.quantity),
                      " · ", h("strong", {}, "الحالة: "), row.status === "out" ? "نفد" : "متوفر"
                    )
                  );
                })
              );
            }
          });

          window.CMS.registerFieldType(
            "size-table",
            SizeTableControl,
            SizeTablePreview
          );

          window.__MY_SOUQ_SIZE_TABLE_REGISTERED__ =
            true;

          return true;
        }

        // Sveltia is loaded immediately before this script and automatic
        // initialization is disabled below. Register the field synchronously
        // before loading config, then initialize the CMS.
        registerSizeTable();
        window.CMS.init();
      })();
    </script>

<script id="my-souq-admin-tools-script">
(function () {

    var workspace = document.createElement("section");

    workspaceTitle.textContent = "مساحة العمل المشتركة";
    var workspaceActions = document.createElement("div");
    workspaceActions.id = "my-souq-workspace-actions";

    var telegramFallback = document.createElement("a");
    telegramFallback.href = TELEGRAM_WEB_URL;
    telegramFallback.target = "_blank";
    telegramFallback.rel = "noopener noreferrer";
    telegramFallback.textContent = "فتح Telegram في نافذة مستقلة ↗";
    telegramFallback.title = "بديل آمن إذا منع المتصفح عرض تيليجرام داخل اللوحة";

    var workspaceClose = document.createElement("button");
    workspaceClose.id = "my-souq-workspace-close";
    workspaceClose.type = "button";
    workspaceClose.textContent = "×";
    workspaceClose.title = "إغلاق مساحة العمل";
    workspaceClose.setAttribute("aria-label", "إغلاق مساحة العمل");

    workspaceActions.appendChild(telegramFallback);
    workspaceActions.appendChild(workspaceClose);
    workspaceHead.appendChild(workspaceTitle);
    workspaceHead.appendChild(workspaceActions);

    var workspaceContent = document.createElement("div");
    workspaceContent.id = "my-souq-workspace-content";
    var telegramFrame = document.createElement("iframe");
    telegramFrame.id = "my-souq-telegram-frame";
    telegramFrame.title = "Telegram Web";
    telegramFrame.setAttribute("allow", "clipboard-read; clipboard-write; fullscreen");
    telegramFrame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
    telegramFrame.src = "about:blank";

    var previewHelp = document.createElement("div");
    previewHelp.id = "my-souq-preview-help";
    previewHelp.innerHTML = "<strong>وضع المعاينة</strong><p>المعاينة الأصلية تظل داخل محرر Sveltia حتى نحافظ على تفاعلاته وتحديثاته. أغلق مساحة العمل لعرضها كما هي، أو استخدم زر المعاينة الأصلي داخل المحرر.</p><button type='button' id='my-souq-preview-return'>الرجوع إلى لوحة Sveltia</button>";

    workspaceContent.appendChild(telegramFrame);
    workspaceContent.appendChild(previewHelp);
    var fallbackNote = document.createElement("div");
    fallbackNote.id = "my-souq-workspace-fallback";
    fallbackNote.textContent = "تيليجرام يمنع العرض داخل إطار مضمّن؛ لذلك يفتح زر Telegram Web الموقع الأصلي في تبويب متصفح عادي لتجنب شاشة «رفض الاتصال».";
    workspace.appendChild(workspaceHead);
    workspace.appendChild(workspaceContent);
    workspace.appendChild(fallbackNote);

    var activeMode = null;
    var telegramTab = null;

    function syncTelegramTabState() {
      if (telegramTab && telegramTab.closed) {
        telegramTab = null;
        if (activeMode === "telegram") setButtonStates(null);
      }
    }
    function setButtonStates(mode) {
      activeMode = mode;
      telegram.classList.toggle("is-active", mode === "telegram");
      preview.classList.toggle("is-active", mode === "preview");
      telegram.setAttribute("aria-pressed", mode === "telegram" ? "true" : "false");
      preview.setAttribute("aria-pressed", mode === "preview" ? "true" : "false");
    }

    function closeWorkspace() {
      workspace.classList.remove("is-open");
      fallbackNote.style.display = "";
      telegramFrame.style.display = "block";
      previewHelp.style.display = "none";
      setButtonStates(null);
    }

    function showTelegram() {
      syncTelegramTabState();
      if (telegramTab && !telegramTab.closed) {
        try { telegramTab.close(); } catch (e) {}
        telegramTab = null;
        setButtonStates(null);
        return;
      }

      /*
       * Telegram blocks iframe embedding. Open the official site in a separate
       * browser window and attempt to place it on the right half of the screen.
       * Some browsers restrict moving/resizing existing windows; no site data,
       * Telegram session, Sveltia settings, or drafts are cleared.
       */
      var screenW = (window.screen && window.screen.availWidth) || 1366;
      var screenH = (window.screen && window.screen.availHeight) || 768;
      var halfW = Math.max(520, Math.floor(screenW / 2));
      var winH = Math.max(600, screenH - 40);
      var rightX = Math.max(0, screenW - halfW);
      var features = [
        "popup=yes", "resizable=yes", "scrollbars=yes",
        "width=" + halfW, "height=" + winH,
        "left=" + rightX, "top=0"
      ].join(",");

      telegramTab = window.open(TELEGRAM_WEB_URL, "MySouqTelegramWeb", features);
      if (telegramTab) {
        setButtonStates("telegram");
        try {
          telegramTab.resizeTo(halfW, winH);
          telegramTab.moveTo(rightX, 0);
          telegramTab.focus();
        } catch (e) {}
        try {
          if (window.outerWidth > halfW + 80 && typeof window.resizeTo === "function") {
            window.resizeTo(halfW, winH);
            window.moveTo(0, 0);
          }
        } catch (e) {}
      } else {
        setButtonStates(null);
        alert("المتصفح منع فتح نافذة تيليجرام. اسمح بالنوافذ المنبثقة لهذا الموقع، أو افتح Telegram Web يدويًا ثم رتّب النافذتين جنبًا إلى جنب باستخدام Win + ← وWin + →.");
      }
    }

    function toggleNativePreview(turnOff) {
      var nodes = document.querySelectorAll("button, a, [role='button'], [role='tab']");
      for (var j = 0; j < nodes.length; j++) {
        var node = nodes[j];
        if (node.closest("#my-souq-admin-tools") || node.closest("#my-souq-admin-workspace")) continue;
        var text = (node.innerText || node.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
        var aria = (node.getAttribute("aria-label") || "").trim().toLowerCase();
        var title = (node.getAttribute("title") || "").trim().toLowerCase();
        if (text === "معاينة" || text === "preview" || aria === "معاينة" || aria === "preview" || title === "معاينة" || title === "preview") {
          var r = node.getBoundingClientRect();
          if (r.width > 0 && r.height > 0) { node.click(); return true; }
        }
      }
      return false;
    }

    function showPreview() {
      if (activeMode === "preview" && !workspace.classList.contains("is-open")) {
        toggleNativePreview(true);
        setButtonStates(null);
        preview.title = "عرض معاينة المنتج";
        return;
      }
      if (activeMode === "preview" && workspace.classList.contains("is-open")) {
        closeWorkspace();
        return;
      }

      /*
       * Sveltia owns the live preview component. Moving it into an external
       * overlay can break the CMS renderer and unsaved editor state, so first
       * switch to Sveltia's own preview control where one is available.
       */
      var nodes = document.querySelectorAll("button, a, [role='button'], [role='tab']");
      var nativePreview = null;
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        if (node.closest("#my-souq-admin-tools") || node.closest("#my-souq-admin-workspace")) continue;
        var label = [
          node.innerText || node.textContent || "",
          node.getAttribute("aria-label") || "",
          node.getAttribute("title") || ""
        ].join(" ").replace(/\\s+/g, " ").trim().toLowerCase();
        var rect = node.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) continue;
        if (/^(معاينة|preview|preview changes|عرض المعاينة)$/.test(label) ||
            /^(معاينة|preview)$/.test((node.getAttribute("aria-label") || "").trim().toLowerCase()) ||
            /^(معاينة|preview)$/.test((node.getAttribute("title") || "").trim().toLowerCase())) {
          nativePreview = node;
          break;
        }
      }

      if (nativePreview) {
        closeWorkspace();
        nativePreview.click();
        setButtonStates("preview");
        preview.title = "المعاينة الأصلية مفعّلة؛ اضغط للعودة أو إغلاقها";
        return;
      }

      /*
       * Safe fallback: don't fabricate a preview or move live CMS nodes.
       * Explain where the original preview remains and preserve all editor data.
       */
      telegramFrame.style.display = "none";
      previewHelp.style.display = "block";
      fallbackNote.style.display = "none";
      workspaceTitle.textContent = "عرض المعاينة";
      workspace.classList.add("is-open");
      setButtonStates("preview");
      preview.title = "عرض المعاينة";
    }

    telegram.addEventListener("click", showTelegram);
    preview.addEventListener("click", showPreview);
    workspaceClose.addEventListener("click", closeWorkspace);
    previewHelp.querySelector("#my-souq-preview-return").addEventListener("click", closeWorkspace);
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && workspace.classList.contains("is-open")) closeWorkspace();
    });

    var logout = document.createElement("button");
    logout.id = "my-souq-logout-btn";
    logout.type = "button";
    logout.textContent = "🚪 تسجيل الخروج";
    logout.title = "تسجيل الخروج من لوحة الإدارة";
    logout.addEventListener("click", function () {
      var ok = window.confirm("هل تريد تسجيل الخروج من لوحة الإدارة؟");
      if (!ok) return;

      /*
       * لا نمسح localStorage/sessionStorage عشوائياً حتى لا نحذف
       * إعدادات أو مسودات Sveltia. بدلاً من ذلك نبحث عن أمر الخروج
       * الأصلي الذي تعرضه Sveltia ونضغطه، إن كان موجوداً.
       */
      var labels = [
        "تسجيل الخروج",
        "خروج",
        "Log out",
        "Logout",
        "Sign out",
        "Sign Out"
      ];

      function normalize(s) {
        return String(s || "")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();
      }

      function findNativeLogout() {
        var candidates = document.querySelectorAll(
          "button, a, [role='button'], [role='menuitem']"
        );

        for (var i = 0; i < candidates.length; i++) {
          var el = candidates[i];
          var text = normalize(el.innerText || el.textContent || el.getAttribute("aria-label"));
          if (!text) continue;

          for (var j = 0; j < labels.length; j++) {
            if (text === normalize(labels[j]) || text.indexOf(normalize(labels[j])) !== -1) {
              return el;
            }
          }
        }
        return null;
      }

      var nativeLogout = findNativeLogout();

      if (nativeLogout) {
        nativeLogout.click();
        return;
      }

      /*
       * Sveltia may render the account menu only after it is opened.
       * Try the likely account/profile controls once, then search again.
       */
      /*
       * Sveltia does not expose a public logout API for an external button.
       * Its account control can also be icon-only, so searching only by
       * visible text is not reliable. We therefore:
       * 1) look for an already-open native logout item;
       * 2) otherwise open the most likely account/menu control;
       * 3) retry several times while Sveltia finishes rendering the menu.
       *
       * We NEVER clear localStorage/sessionStorage here, so Sveltia
       * preferences/drafts and the separate Telegram Web session remain
       * untouched.
       */
      var profileCandidates = document.querySelectorAll(
        "button, [role='button'], a"
      );
      var ranked = [];

      for (var k = 0; k < profileCandidates.length; k++) {
        var p = profileCandidates[k];
        var aria = normalize(p.getAttribute("aria-label"));
        var title = normalize(p.getAttribute("title"));
        var txt = normalize(p.innerText || p.textContent);
        var hasPopup = normalize(p.getAttribute("aria-haspopup"));
        var rect = p.getBoundingClientRect();

        if (rect.width <= 0 || rect.height <= 0) continue;

        var score = 0;

        if (
          aria.indexOf("account") !== -1 ||
          aria.indexOf("profile") !== -1 ||
          aria.indexOf("user") !== -1 ||
          aria.indexOf("الحساب") !== -1 ||
          aria.indexOf("الملف") !== -1
        ) score += 100;

        if (
          title.indexOf("account") !== -1 ||
          title.indexOf("profile") !== -1 ||
          title.indexOf("user") !== -1 ||
          title.indexOf("الحساب") !== -1
        ) score += 80;

        if (txt === "admin" || txt === "administrator") score += 70;
        if (hasPopup === "menu" || hasPopup === "true") score += 50;

        /*
         * Account controls are normally in the top header. Prefer controls
         * near the top-right without assuming a fragile Sveltia CSS class.
         */
        if (rect.top < 100) score += 20;
        if (rect.right > window.innerWidth * 0.65) score += 20;

        if (score > 0) ranked.push({ el: p, score: score });
      }

      ranked.sort(function (a, b) {
        return b.score - a.score;
      });

      var openedMenu = false;

      if (ranked.length) {
        ranked[0].el.click();
        openedMenu = true;
      }

      function retryNativeLogout(attempt) {
        var retry = findNativeLogout();
        if (retry) {
          retry.click();
          return;
        }

        if (attempt < 5) {
          setTimeout(function () {
            retryNativeLogout(attempt + 1);
          }, 200);
          return;
        }

        alert("تعذر العثور على أمر تسجيل الخروج الأصلي في Sveltia. لم يتم حذف أي إعدادات أو مسودات.");
      }

      if (openedMenu) {
        setTimeout(function () {
          retryNativeLogout(0);
        }, 150);
      } else {
        alert("تعذر العثور على قائمة حساب Sveltia. لم يتم حذف أي إعدادات أو مسودات.");
      }
    });

    wrap.appendChild(telegram);
    wrap.appendChild(excelBtn);
    wrap.appendChild(importBtn);
    wrap.appendChild(preview);
    wrap.appendChild(logout);
    document.body.appendChild(workspace);
    document.body.appendChild(wrap);

    /* ===== زر الاستيراد ===== */
    importBtn.addEventListener("click", function () {
      openImportModal();
    });
  }

  /* ---------- استيراد Excel / CSV: قراءة + معاينة (الخطوة 2) ---------- */
  var __msqImportParsedRows = [];
  /* ملفات الصور المختارة من الجهاز: الاسم → File */
  var __msqImportImageFiles = {};
  /* بعد التحويل لـ WebP: الاسم الأصلي → الاسم المحفوظ */
  var __msqImageSavedNames = {};

  function ensureSheetJS(callback) {
    if (window.XLSX) {
      callback();
      return;
    }
    var s = document.createElement("script");
    s.src = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
    s.onload = function () { callback(); };
    s.onerror = function () {
      alert("تعذر تحميل مكتبة قراءة Excel. تحقق من الاتصال بالإنترنت وحاول مرة أخرى.");
    };
    document.head.appendChild(s);
  }

  function normalizeHeader(h) {
    return String(h || "")
      .replace(/\u200f|\u200e/g, "")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, " ");
  }

  /* خريطة أسماء الأعمدة المحتملة → المفتاح الداخلي */
  var HEADER_MAP = {
    "title": "title",
    "اسم المنتج": "title",
    "اسم": "title",
    "المنتج": "title",
    "name": "title",
    "product": "title",
    "category": "category",
    "القسم": "category",
    "القسم الرئيسي": "category",
    "subcategory": "subcategory",
    "نوع الملابس": "subcategory",
    "النوع": "subcategory",
    "price": "price",
    "السعر": "price",
    "السعر الأساسي": "price",
    "oldprice": "oldPrice",
    "old price": "oldPrice",
    "السعر القديم": "oldPrice",
    "قبل الخصم": "oldPrice",
    "stock": "stock",
    "المخزون": "stock",
    "حالة المخزون": "stock",
    "sizes": "sizes",
    "المقاسات": "sizes",
    "مقاسات": "sizes",
    "مقاس": "size",
    "المقاس": "size",
    "variants": "sizes",
    "size": "size",
    "طول البنطلون": "pants_length",
    "pants_length": "pants_length",
    "بنطلون": "pants_length",
    "عرض التيشيرت": "tshirt_width",
    "عرض التيشرت": "tshirt_width",
    "tshirt_width": "tshirt_width",
    "طول التيشيرت": "tshirt_length",
    "طول التيشرت": "tshirt_length",
    "tshirt_length": "tshirt_length",
    "القطعة الإضافية": "extra_piece",
    "القطعه الاضافيه": "extra_piece",
    "قطعة إضافية": "extra_piece",
    "extra_piece": "extra_piece",
    "extra": "extra_piece",
    "images": "images",
    "الصور": "images",
    "صور": "images",
    "image": "images",
    "body": "body",
    "الوصف": "body",
    "تفاصيل": "body",
    "description": "body"
  };

  function parseImagesText(text) {
    if (!text) return [];
    return String(text)
      .split(/[\n\r,;|]+/)
      .map(function (s) { return s.trim(); })
      .filter(Boolean)
      .map(function (s) {
        var m = s.match(/([^\/\\]+\.(webp|jpe?g|png|gif|svg))$/i);
        var name = m ? m[1] : s.replace(/^.*[\/\\]/, "");
        /* لو اتحولت لـ WebP أثناء الرفع، استخدم الاسم النهائي */
        var saved =
          __msqImageSavedNames[name] ||
          __msqImageSavedNames[name.toLowerCase()] ||
          null;
        var finalName = saved || toWebpFileName(name);
        /* لو المستخدم كاتب رابط خارجي، سيبه */
        if (/^https?:\/\//i.test(s)) {
          return { name: name, path: s };
        }
        if (s.indexOf("/images/") === 0) {
          /* حدّث الامتداد لـ webp لو كان محلي */
          var localPath = s.replace(/\.(jpe?g|png|gif)$/i, ".webp");
          if (saved) localPath = "/images/products/" + saved;
          return { name: finalName, path: localPath };
        }
        return { name: finalName, path: "/images/products/" + finalName };
      });
  }

  function mapRow(raw) {
    var out = {
      title: "",
      category: "Kids",
      subcategory: "ملابس للمنزل",
      price: 0,
      oldPrice: null,
      stock: "available",
      size: "",
      sizes: "",
      pants_length: "",
      tshirt_width: "",
      tshirt_length: "",
      extra_piece: "",
      images: "",
      body: "",
      _raw: raw
    };
    Object.keys(raw).forEach(function (k) {
      var key = HEADER_MAP[normalizeHeader(k)];
      if (!key) return;
      var val = raw[k];
      if (val === undefined || val === null) return;
      val = String(val).trim();
      if (key === "price" || key === "oldPrice") {
        var n = parseInt(val.replace(/[^\d]/g, ""), 10);
        out[key] = isNaN(n) ? (key === "oldPrice" ? null : 0) : n;
      } else if (key === "stock") {
        var s = val.toLowerCase();
        if (/نفد|out|غير متوفر|unavailable/.test(s)) out.stock = "out";
        else if (/قليل|low|محدود/.test(s)) out.stock = "low";
        else out.stock = "available";
      } else if (key === "category") {
        if (/baby|بيبي|رضع/i.test(val)) out.category = "Baby";
        else if (/mr|mrs|رجالي|حريمي|رجال|نساء/i.test(val)) out.category = "Mr & Mrs";
        else if (/عرض|عروض|offer/i.test(val)) out.category = "عروض";
        else out.category = "Kids";
      } else {
        out[key] = val;
      }
    });
    return out;
  }

  /* تجميع صفوف الإكسل: نفس اسم المنتج = منتج واحد بعدة مقاسات */
  function groupRowsIntoProducts(flatRows) {
    var order = [];
    var map = {};
    flatRows.forEach(function (row) {
      var title = String(row.title || "").trim();
      if (!title) return;
      if (!map[title]) {
        map[title] = {
          title: title,
          category: row.category || "Kids",
          subcategory: row.subcategory || "ملابس للمنزل",
          price: row.price || 0,
          oldPrice: row.oldPrice,
          stock: row.stock || "available",
          images: row.images || "",
          body: row.body || "",
          sizes: row.sizes || "",
          variantRows: []
        };
        order.push(title);
      }
      var prod = map[title];
      /* خذ أول قيم غير فارغة للحقول العامة */
      if (!prod.images && row.images) prod.images = row.images;
      if (!prod.body && row.body) prod.body = row.body;
      if ((!prod.price || prod.price === 0) && row.price) prod.price = row.price;
      if (prod.oldPrice == null && row.oldPrice != null) prod.oldPrice = row.oldPrice;
      if (row.category) prod.category = row.category;
      if (row.subcategory) prod.subcategory = row.subcategory;
      if (row.stock) prod.stock = row.stock;
      if (row.sizes) prod.sizes = row.sizes;

      var sizeLabel = normalizeSizeLabel(row.size || "");
      /* دعم العمود القديم «المقاسات» لو مفيش عمود مقاس منفصل */
      if (!sizeLabel && row.sizes) {
        /* هتتعالج لاحقًا من parseSizesText */
        return;
      }
      if (!sizeLabel) return;

      prod.variantRows.push({
        size: sizeLabel,
        color: "",
        price: null,
        quantity: 0,
        pants_length: row.pants_length || "",
        tshirt_length: row.tshirt_length || "",
        tshirt_width: row.tshirt_width || "",
        extra_piece: row.extra_piece || "",
        status: "available"
      });
    });

    return order.map(function (title) {
      var p = map[title];
      /* لو مفيش صفوف مقاس منفصلة لكن في عمود المقاسات المختصر القديم */
      if (!p.variantRows.length && p.sizes) {
        p.variantRows = parseSizesText(p.sizes);
      }
      p.variants = p.variantRows;
      return p;
    });
  }

  function normalizeSizeLabel(raw) {
    var s = String(raw || "").trim();
    if (!s) return "";

    /* أرقام عربية → إنجليزية */
    s = s.replace(/[٠-٩]/g, function (d) {
      return String("٠١٢٣٤٥٦٧٨٩".indexOf(d));
    });
    s = s.replace(/\s+/g, " ").trim();

    /* مقاس موحد */
    if (/^(مقاس\s*)?موحد$/i.test(s) || /one\s*size|free\s*size|^os$/i.test(s)) {
      return "مقاس موحد";
    }

    /* مقاسات عادية: XS S M L XL XXL 2XL 3XL 4XL */
    if (/^(x{0,3}s|x{0,3}m|x{0,3}l|\d+xl|xxl|xxxl)$/i.test(s)) {
      return s.toUpperCase().replace(/\s+/g, "");
    }

    /* بالشهور: 0M 3M 6M 12M أو 6 شهر / 12 شهور */
    if (/^\d+\s*m$/i.test(s)) {
      return s.toUpperCase().replace(/\s+/g, "");
    }
    var monthAr = s.match(/^(\d+)\s*(شهر|أشهر|اشهر|شهور)$/i);
    if (monthAr) {
      return monthAr[1] + "M";
    }

    /* بالسنين: 2 سنة / 4 سنين / 6 سنوات / 2y */
    var year = s.match(/^(\d+)\s*(سنة|سنين|سنوات|سنه|y|yr|year|years)$/i);
    if (year) {
      return year[1] + " سنة";
    }

    /* رقم لوحده من 1 إلى 16 → سنين (كوليكشن أطفال) */
    if (/^\d+$/.test(s)) {
      var n = parseInt(s, 10);
      if (n >= 1 && n <= 16) return n + " سنة";
      return s;
    }

    /* أي صيغة أخرى تُحفظ كما هي */
    return s;
  }

  function parseSizesText(text) {
    if (!text) return [];
    /*
      أنواع المقاسات (الفصل: | أو ، أو , أو ; أو سطر جديد):

      1) سنين:   2 سنة | 4 سنة | 6 سنة     أو    2 | 4 | 6
      2) شهور:   0M | 3M | 6M | 12M | 18M | 24M     أو    6 شهر
      3) عادي:   S | M | L | XL | 2XL | 3XL | XXL
      4) مع أبعاد بعد : 
         2:48x32x38 | 4:55x33x42
         XL:70x52
         6M:40x28
    */
    var parts = String(text)
      .split(/[|،,;\n\r]+/)
      .map(function (p) { return p.trim(); })
      .filter(Boolean);

    var variants = [];
    parts.forEach(function (p) {
      var m = p.match(/^(.+?)(?::|：)\s*(.*)$/);
      var sizeRaw = m ? m[1].trim() : p;
      var dims = m ? m[2].trim() : "";

      /* لو اللي بعد : مش أبعاد رقمية، اعتبر السطر كله اسم مقاس */
      if (dims && !/^[\d.\s x×*\-]+$/i.test(dims)) {
        sizeRaw = p;
        dims = "";
      }

      var size = normalizeSizeLabel(sizeRaw);
      if (!size) return;

      var pants = "";
      var tLength = "";
      var tWidth = "";

      if (dims) {
        var triple = dims.match(
          /(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)/i
        );
        if (triple) {
          pants = triple[1];
          tWidth = triple[2];
          tLength = triple[3];
        } else {
          var dm = dims.match(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)/i);
          if (dm) {
            tLength = dm[1];
            tWidth = dm[2];
          } else if (/^\d+(?:\.\d+)?$/.test(dims)) {
            tLength = dims;
          }
        }
      }

      variants.push({
        size: size,
        color: "",
        price: null,
        quantity: 0,
        pants_length: pants,
        tshirt_length: tLength,
        tshirt_width: tWidth,
        extra_piece: "",
        status: "available"
      });
    });
    return variants;
  }

  function renderImportPreview(rows) {
    var box = document.getElementById("msq-import-preview");
    if (!box) return;
    if (!rows.length) {
      box.innerHTML = '<p class="msq-import-empty">لم يتم العثور على صفوف صالحة في الملف.</p>';
      return;
    }
    var html = [
      '<div class="msq-import-preview-meta">تم قراءة <strong>' + rows.length + '</strong> منتج. راجع البيانات قبل الاستيراد.</div>',
      '<div class="msq-import-table-wrap"><table class="msq-import-table"><thead><tr>',
      '<th>#</th><th>اسم المنتج</th><th>القسم</th><th>النوع</th><th>السعر</th><th>القديم</th><th>المخزون</th><th>المقاسات</th><th>الصور</th>',
      '</tr></thead><tbody>'
    ];
    rows.forEach(function (r, i) {
      var sizesCount = (r.variants && r.variants.length) || parseSizesText(r.sizes).length || 0;
      var imgsCount = parseImagesText(r.images).length;
      var sizePreview = (r.variants || []).map(function (v) { return v.size; }).filter(Boolean).slice(0, 6).join("، ");
      html.push(
        "<tr>" +
        "<td>" + (i + 1) + "</td>" +
        "<td>" + escapeHtml(r.title || "—") + "</td>" +
        "<td>" + escapeHtml(r.category) + "</td>" +
        "<td>" + escapeHtml(r.subcategory) + "</td>" +
        "<td>" + (r.price || "—") + "</td>" +
        "<td>" + (r.oldPrice != null ? r.oldPrice : "—") + "</td>" +
        "<td>" + (r.stock === "out" ? "نفد" : r.stock === "low" ? "قليل" : "متوفر") + "</td>" +
        "<td title=\"" + escapeHtml(sizePreview) + "\">" + (sizesCount ? sizesCount + " مقاس" : "—") + "</td>" +
        "<td>" + (imgsCount ? imgsCount + " صورة" : "—") + "</td>" +
        "</tr>"
      );
    });
    html.push("</tbody></table></div>");
    box.innerHTML = html.join("");
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function handleImportFile(file) {
    var statusEl = document.getElementById("msq-import-status");
    var startBtn = document.getElementById("msq-import-start");
    var nameEl = document.getElementById("msq-import-file-name");
    __msqImportParsedRows = [];
    startBtn.disabled = true;
    startBtn.textContent = "جاري القراءة...";
    statusEl.textContent = "جاري قراءة الملف...";
    nameEl.textContent = "الملف: " + file.name + " (" + Math.round(file.size / 1024) + " ك.ب)";

    ensureSheetJS(function () {
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var data = new Uint8Array(ev.target.result);
          var wb = window.XLSX.read(data, { type: "array" });
          var sheetName = wb.SheetNames[0];
          var sheet = wb.Sheets[sheetName];
          var json = window.XLSX.utils.sheet_to_json(sheet, { defval: "" });
          if (!json.length) {
            statusEl.textContent = "الملف فاضي أو مفيش صفوف بيانات.";
            startBtn.textContent = "بدء الاستيراد";
            renderImportPreview([]);
            return;
          }
          var flatRows = json.map(mapRow).filter(function (r) {
            return r.title && String(r.title).trim().length > 0;
          });
          var rows = groupRowsIntoProducts(flatRows);
          __msqImportParsedRows = rows;
          renderImportPreview(rows);
          if (rows.length) {
            var varCount = rows.reduce(function (n, p) {
              return n + ((p.variants && p.variants.length) || 0);
            }, 0);
            statusEl.textContent = "جاهز للاستيراد — " + rows.length + " منتج / " + varCount + " مقاس.";
            startBtn.disabled = false;
            startBtn.textContent = "بدء الاستيراد (" + rows.length + ")";
          } else {
            statusEl.textContent = "مفيش صفوف فيها اسم منتج صالح.";
            startBtn.textContent = "بدء الاستيراد";
          }
        } catch (err) {
          console.error(err);
          statusEl.textContent = "حصل خطأ أثناء قراءة الملف. تأكد إنه Excel أو CSV سليم.";
          startBtn.textContent = "بدء الاستيراد";
          renderImportPreview([]);
        }
      };
      reader.onerror = function () {
        statusEl.textContent = "تعذر قراءة الملف من الجهاز.";
        startBtn.textContent = "بدء الاستيراد";
      };
      reader.readAsArrayBuffer(file);
    });
  }

      }
      var names = [];
      for (var i = 0; i < files.length; i++) {
        var f = files[i];

        /* أيضًا بالمفتاح بدون مسافات زائدة وبحالة صغيرة للمطابقة المرنة */
        __msqImportImageFiles[f.name.toLowerCase()] = f;
      }
      names.sort(function (a, b) {
        return a.localeCompare(b, "ar", { numeric: true, sensitivity: "base" });
      });
      ta.value = names.join("\n");
      box.style.display = "block";
      var statusEl = document.getElementById("msq-import-status");
      if (statusEl) {
        statusEl.textContent = "تم اختيار " + names.length + " صورة — هتترفع مع الاستيراد وتتنسخ أسماؤها تحت.";

    document.getElementById("msq-names-copy").addEventListener("click", function () {

      if (!ta.value) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(function () {
          var btn = document.getElementById("msq-names-copy");
          var old = btn.textContent;
          btn.textContent = "تم النسخ ✓";
          setTimeout(function () { btn.textContent = old; }, 1500);
        }).catch(function () {
          ta.select();
          document.execCommand("copy");
        });
      } else {
        ta.select();
        document.execCommand("copy");
      }
    });

    document.getElementById("msq-import-start").addEventListener("click", function () {
      if (!__msqImportParsedRows.length) return;
      startGitHubImport(__msqImportParsedRows);
    });
  }

  /* ---------- الخطوة 3: الكتابة على GitHub ---------- */
  var GITHUB_REPO = "souq-elektroni/My-Souq.github.io";
  var GITHUB_BRANCH = "main";
  var PRODUCTS_PATH = "products";

  function findStoredGitHubToken() {
    try {
      var keys = Object.keys(localStorage);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var v = localStorage.getItem(k);
        if (!v) continue;
        if (/^(ghp_|github_pat_|gho_|ghu_)/.test(v.trim())) return v.trim();
        if (v.charAt(0) === "{" || v.charAt(0) === "[") {
          try {
            var obj = JSON.parse(v);
            var token = digToken(obj);
            if (token) return token;
          } catch (e) {}
        }
      }
    } catch (e) {}
    return null;
  }

  function digToken(obj, depth) {
    if (depth == null) depth = 0;
    if (depth > 6 || obj == null) return null;
    if (typeof obj === "string" && /^(ghp_|github_pat_|gho_|ghu_)/.test(obj)) return obj;
    if (typeof obj !== "object") return null;
    if (obj.token && typeof obj.token === "string" && obj.token.length > 20) return obj.token;
    if (obj.access_token && typeof obj.access_token === "string") return obj.access_token;
    if (obj.accessToken && typeof obj.accessToken === "string") return obj.accessToken;
    var keys = Object.keys(obj);
    for (var i = 0; i < keys.length; i++) {
      var found = digToken(obj[keys[i]], depth + 1);
      if (found) return found;
    }
    return null;
  }

  function askForToken() {
    var t = window.prompt(
      "لم يتم العثور على توكن GitHub من جلسة Sveltia.\n\nالصق Personal Access Token (صلاحية repo أو Contents: Read and write):\n\nيمكنك إنشاؤه من:\nGitHub → Settings → Developer settings → Personal access tokens",
      ""
    );
    if (t) t = t.trim();
    return t || null;
  }

  function slugifyTitle(title) {
    var map = {
      "ا": "a", "أ": "a", "إ": "i", "آ": "a", "ب": "b", "ت": "t", "ث": "th",
      "ج": "j", "ح": "h", "خ": "kh", "د": "d", "ذ": "dh", "ر": "r", "ز": "z",
      "س": "s", "ش": "sh", "ص": "s", "ض": "d", "ط": "t", "ظ": "z", "ع": "a",
      "غ": "gh", "ف": "f", "ق": "q", "ك": "k", "ل": "l", "م": "m", "ن": "n",
      "ه": "h", "و": "w", "ي": "y", "ى": "a", "ة": "h", "ء": "", "ؤ": "w",
      "ئ": "y", "ً": "", "ٌ": "", "ٍ": "", "َ": "", "ُ": "", "ِ": "", "ّ": "", "ْ": ""
    };
    var s = String(title || "").trim();
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      if (map[ch] !== undefined) out += map[ch];
      else if (/[a-zA-Z0-9]/.test(ch)) out += ch.toLowerCase();
      else if (/\s|-|_/.test(ch)) out += "-";
    }
    out = out.replace(/-+/g, "-").replace(/^-|-$/g, "");
    if (!out) out = "product-" + Date.now();
    return out;
  }

  function buildMarkdown(row) {
    var variants = (row.variants && row.variants.length)
      ? row.variants
      : parseSizesText(row.sizes);
    var images = parseImagesText(row.images);
    var lines = ["---"];
    lines.push("title: " + yamlQuote(row.title));
    lines.push("category: " + yamlQuote(row.category || "Kids"));
    lines.push("subcategory: " + yamlQuote(row.subcategory || "ملابس للمنزل"));
    lines.push("designs: []");
    if (images.length) {
      lines.push("images:");
      images.forEach(function (img) {
        lines.push("  - " + img.path);
      });
    } else {
      lines.push("images: []");
    }
    lines.push("price: " + (parseInt(row.price, 10) || 0));
    if (row.oldPrice != null && row.oldPrice !== "") {
      lines.push("oldPrice: " + parseInt(row.oldPrice, 10));
    } else {
      lines.push("oldPrice: null");
    }
    lines.push("stock: " + (row.stock || "available"));
    if (variants.length) {
      lines.push("variants:");
      variants.forEach(function (v) {
        /* نضع size بين علامات اقتباس دائمًا عشان الأرقام زي 4 متتبقاش number في YAML */
        lines.push("  - size: " + JSON.stringify(String(v.size || "")));
        lines.push("    color: " + JSON.stringify(String(v.color || "")));
        lines.push("    price: null");
        lines.push("    quantity: " + (parseInt(v.quantity, 10) || 0));
        lines.push("    pants_length: " + JSON.stringify(String(v.pants_length || "")));
        lines.push("    tshirt_length: " + JSON.stringify(String(v.tshirt_length || "")));
        lines.push("    tshirt_width: " + JSON.stringify(String(v.tshirt_width || "")));
        lines.push("    extra_piece: " + JSON.stringify(String(v.extra_piece || "")));
        lines.push("    status: " + (v.status || "available"));
      });
    } else {
      lines.push("variants: []");
    }
    lines.push("---");
    lines.push("");
    if (row.body) lines.push(String(row.body).trim());
    lines.push("");
    return lines.join("\n");
  }

  function yamlQuote(val) {
    var s = String(val == null ? "" : val);
    if (/[:#\[\]{},&*?|>!%@`]/.test(s) || /^\s|\s$/.test(s) || s === "" || /[\n\r]/.test(s)) {
      return JSON.stringify(s);
    }
    return s;
  }

  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  function githubApi(path, token, options) {
    options = options || {};
    return fetch("https://api.github.com" + path, {
      method: options.method || "GET",
      headers: {
        Accept: "application/vnd.github+json",
        Authorization: "Bearer " + token,
        "X-GitHub-Api-Version": "2022-11-28",
        "Content-Type": "application/json"
      },
      body: options.body ? JSON.stringify(options.body) : undefined
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) {
          var msg = (data && data.message) || ("HTTP " + res.status);
          var err = new Error(msg);
          err.status = res.status;
          err.data = data;
          throw err;
        }
        return data;
      });
    });
  }

  function createOrUpdateFile(token, path, content, message) {
    var apiPath = "/repos/" + GITHUB_REPO + "/contents/" + path;
    return githubApi(apiPath + "?ref=" + GITHUB_BRANCH, token)
      .then(function (existing) {
        return githubApi(apiPath, token, {
          method: "PUT",
          body: {
            message: message,
            content: utf8ToBase64(content),
            branch: GITHUB_BRANCH,
            sha: existing.sha
          }
        });
      })
      .catch(function (err) {
        if (err.status === 404) {
          return githubApi(apiPath, token, {
            method: "PUT",
            body: {
              message: message,
              content: utf8ToBase64(content),
              branch: GITHUB_BRANCH
            }
          });
        }
        throw err;
      });
  }

  function setImportProgress(done, total, text) {
    var statusEl = document.getElementById("msq-import-status");
    var startBtn = document.getElementById("msq-import-start");
    if (statusEl) statusEl.textContent = text || ("جاري الاستيراد... " + done + " / " + total);
    if (startBtn) {
      startBtn.disabled = true;
      startBtn.textContent = text || ("جاري الاستيراد... " + done + " / " + total);
    }
  }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result || "";
        var base64 = String(result).split(",")[1] || "";
        resolve(base64);
      };
      reader.onerror = function () {
        reject(new Error("تعذر قراءة الملف: " + file.name));
      };
      reader.readAsDataURL(file);
    });
  }

  function toWebpFileName(name) {
    return String(name || "image")
      .replace(/\.[^.]+$/, "")
      .replace(/[^\w\u0600-\u06FF\-]+/g, "-")
      .replace(/-+/g, "-")
      .replace(/^-|-$/g, "") + ".webp";
  }

  /* تحويل أي صورة إلى WebP عبر Canvas قبل الرفع */
  function convertImageFileToWebp(file, quality) {
    quality = quality == null ? 0.82 : quality;
    return new Promise(function (resolve, reject) {
      /* لو الملف WebP بالفعل ومش محتاجين إعادة ترميز كبيرة */
      if (/\.webp$/i.test(file.name) && file.type === "image/webp") {
        fileToBase64(file).then(function (b64) {
          resolve({ name: file.name, base64: b64 });
        }).catch(reject);
        return;
      }

      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var maxSide = 1400;
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          var scale = 1;
          if (w > maxSide || h > maxSide) {
            scale = maxSide / Math.max(w, h);
          }
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw;
          canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          var dataUrl = canvas.toDataURL("image/webp", quality);
          URL.revokeObjectURL(url);
          if (!dataUrl || dataUrl.indexOf("image/webp") === -1) {
            /* المتصفح لا يدعم WebP export → ارفع الأصل */
            fileToBase64(file).then(function (b64) {
              resolve({ name: file.name, base64: b64 });
            }).catch(reject);
            return;
          }
          var base64 = dataUrl.split(",")[1] || "";
          resolve({ name: toWebpFileName(file.name), base64: base64 });
        } catch (err) {
          URL.revokeObjectURL(url);
          reject(err);
        }
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("تعذر فتح الصورة: " + file.name));
      };
      img.src = url;
    });
  }

  function collectNeededImageNames(rows) {
    var set = {};
    rows.forEach(function (row) {
      parseImagesText(row.images).forEach(function (img) {
        set[img.name] = true;
        set[img.name.toLowerCase()] = true;
      });
    });
    return set;
  }

  function resolveImageFile(name) {
    if (!name) return null;
    if (__msqImportImageFiles[name]) return __msqImportImageFiles[name];
    if (__msqImportImageFiles[name.toLowerCase()]) return __msqImportImageFiles[name.toLowerCase()];
    /* مطابقة جزئية: لو الاسم في الإكسل بدون امتداد */
    var keys = Object.keys(__msqImportImageFiles);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (k === name || k.toLowerCase() === name.toLowerCase()) return __msqImportImageFiles[k];
      if (k.replace(/\.[^.]+$/, "").toLowerCase() === name.replace(/\.[^.]+$/, "").toLowerCase()) {
        return __msqImportImageFiles[k];
      }
    }
    return null;
  }

  function uploadOneImage(token, file) {
    return convertImageFileToWebp(file, 0.82).then(function (converted) {
      var path = "images/products/" + converted.name;
      return createOrUpdateBinaryFile(
        token,
        path,
        converted.base64,
        "upload image: " + converted.name
      ).then(function (res) {
        return { originalName: file.name, savedName: converted.name, path: "/" + path, res: res };
      });
    });
  }

  function createOrUpdateBinaryFile(token, path, base64Content, message) {
    var apiPath = "/repos/" + GITHUB_REPO + "/contents/" + path;
    return githubApi(apiPath + "?ref=" + GITHUB_BRANCH, token)
      .then(function (existing) {
        return githubApi(apiPath, token, {
          method: "PUT",
          body: {
            message: message,
            content: base64Content,
            branch: GITHUB_BRANCH,
            sha: existing.sha
          }
        });
      })
      .catch(function (err) {
        if (err.status === 404) {
          return githubApi(apiPath, token, {
            method: "PUT",
            body: {
              message: message,
              content: base64Content,
              branch: GITHUB_BRANCH
            }
          });
        }
        throw err;
      });
  }

  function uploadImagesForRows(token, rows) {
    var needed = collectNeededImageNames(rows);
    var toUpload = [];
    var seen = {};
    Object.keys(needed).forEach(function (name) {
      var file = resolveImageFile(name);
      if (file && !seen[file.name]) {
        seen[file.name] = true;
        toUpload.push(file);
      }
    });

    /* لو مفيش أسماء في الإكسل لكن في صور مختارة، ارفع كل الصور المختارة */
    if (!toUpload.length) {
      Object.keys(__msqImportImageFiles).forEach(function (k) {
        var f = __msqImportImageFiles[k];
        if (f && f.name && !seen[f.name]) {
          seen[f.name] = true;
          toUpload.push(f);
        }
      });
    }

    if (!toUpload.length) {
      return Promise.resolve({ ok: 0, fail: 0, errors: [], skipped: true });
    }

    var ok = 0;
    var fail = 0;
    var errors = [];
    var i = 0;

    function next() {
      if (i >= toUpload.length) {
        return Promise.resolve({ ok: ok, fail: fail, errors: errors, skipped: false });
      }
      var file = toUpload[i];
      var idx = i + 1;
      i += 1;
      setImportProgress(idx - 1, toUpload.length, "رفع صورة (" + idx + "/" + toUpload.length + "): " + file.name);

      return uploadOneImage(token, file)
        .then(function (info) {
          ok += 1;
          if (info && info.originalName && info.savedName) {
            __msqImageSavedNames[info.originalName] = info.savedName;
            __msqImageSavedNames[info.originalName.toLowerCase()] = info.savedName;
            __msqImageSavedNames[info.savedName] = info.savedName;
          }
          return new Promise(function (r) { setTimeout(r, 400); });
        })
        .catch(function (err) {
          fail += 1;
          errors.push(file.name + ": " + (err.message || err));
          return new Promise(function (r) { setTimeout(r, 200); });
        })
        .then(next);
    }

    return next();
  }

  function startGitHubImport(rows) {
    var token = findStoredGitHubToken();
    if (!token) token = askForToken();
    if (!token) {
      alert("لم يتم توفير توكن. تم إلغاء الاستيراد.");
      return;
    }

    var startBtn = document.getElementById("msq-import-start");
    var statusEl = document.getElementById("msq-import-status");
    startBtn.disabled = true;
    setImportProgress(0, rows.length, "التحقق من التوكن...");

    var imgResult = { ok: 0, fail: 0, errors: [] };
    __msqImageSavedNames = {};

    githubApi("/user", token)
      .then(function (user) {
        setImportProgress(0, rows.length, "تم الدخول باسم: " + (user.login || "user"));
        return uploadImagesForRows(token, rows);
      })
      .then(function (imagesOutcome) {
        imgResult = imagesOutcome || imgResult;
        setImportProgress(0, rows.length, "تم رفع الصور — بدء كتابة المنتجات...");
        return runImportQueue(token, rows);
      })
      .then(function (result) {
        var msg =
          "تم الاستيراد.\n" +
          "صور مرفوعة: " + (imgResult.ok || 0) + (imgResult.fail ? " · فشل صور: " + imgResult.fail : "") + "\n" +
          "منتجات أُضيفت/حُدّثت: " + result.ok + "\n" +
          "فشل منتجات: " + result.fail;
        var allErrors = (imgResult.errors || []).concat(result.errors || []);
        if (allErrors.length) {
          msg += "\n\nأخطاء:\n- " + allErrors.slice(0, 8).join("\n- ");
        }
        if (statusEl) {
          statusEl.textContent =
            "انتهى: صور " + (imgResult.ok || 0) + " · منتجات " + result.ok +
            " · فشل " + ((imgResult.fail || 0) + result.fail);
        }
        if (startBtn) {
          startBtn.disabled = false;
          startBtn.textContent = "بدء الاستيراد (" + rows.length + ")";
        }
        alert(msg + "\n\nحدّث صفحة لوحة الإدارة بعد قليل عشان تشوف المنتجات والصور.");
      })
      .catch(function (err) {
        console.error(err);
        if (statusEl) statusEl.textContent = "فشل: " + (err.message || err);
        if (startBtn) {
          startBtn.disabled = false;
          startBtn.textContent = "بدء الاستيراد (" + rows.length + ")";
        }
        alert("فشل الاستيراد: " + (err.message || err) + "\n\nتأكد إن التوكن صالح وفيه صلاحية الكتابة على الريبو.");
      });
  }

  function runImportQueue(token, rows) {
    var ok = 0;
    var fail = 0;
    var errors = [];
    var i = 0;

    function next() {
      if (i >= rows.length) {
        return Promise.resolve({ ok: ok, fail: fail, errors: errors });
      }
      var row = rows[i];
      var idx = i + 1;
      i += 1;
      var slug = slugifyTitle(row.title);
      var path = PRODUCTS_PATH + "/" + slug + ".md";
      var content = buildMarkdown(row);
      var message = "import: " + row.title;

      setImportProgress(idx - 1, rows.length, "كتابة منتج (" + idx + "/" + rows.length + "): " + row.title);

      return createOrUpdateFile(token, path, content, message)
        .then(function () {
          ok += 1;
          return new Promise(function (r) { setTimeout(r, 350); });
        })
        .catch(function (err) {
          fail += 1;
          errors.push(row.title + ": " + (err.message || err));
          return new Promise(function (r) { setTimeout(r, 200); });
        })
        .then(next);
    }

    return next();
  }

  function start() {
    createAdminTools();
    var observer = new MutationObserver(function () {
      createAdminTools();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>

<script id="my-souq-paired-designs-layout-v8">
(function () {
  "use strict";

  function isFront(el) {
    var k = el.getAttribute("data-key-path") || el.getAttribute("data-typed-key-path") || "";
    return /\.front_image$/.test(k) || k === "front_image";
  }
  function isBack(el) {
    var k = el.getAttribute("data-key-path") || el.getAttribute("data-typed-key-path") || "";
    return /\.back_image$/.test(k) || k === "back_image";
  }

  function branch(parent, node) {
    while (node && node.parentElement !== parent) node = node.parentElement;
    return node && node.parentElement === parent ? node : null;
  }

  function forceGrid(parent, a, b) {
    if (!parent || !a || !b || a === b) return;
    parent.classList.add("msq-pair-grid");
    parent.style.setProperty("display", "grid", "important");
    parent.style.setProperty("grid-template-columns", "minmax(0,1fr) minmax(0,1fr)", "important");
    parent.style.setProperty("gap", "12px", "important");
    parent.style.setProperty("align-items", "start", "important");
    parent.style.setProperty("width", "100%", "important");
    a.style.setProperty("min-width", "0", "important");
    b.style.setProperty("min-width", "0", "important");
    a.style.setProperty("width", "100%", "important");
    b.style.setProperty("width", "100%", "important");
    a.style.setProperty("grid-row", "1", "important");
    b.style.setProperty("grid-row", "1", "important");
    a.style.setProperty("margin", "0", "important");
    b.style.setProperty("margin", "0", "important");
  }

  function pairFields(frontEl, backEl) {
    var p = frontEl.parentElement;
    var steps = 0;
    while (p && p !== document.body && steps++ < 20) {
      var x = branch(p, frontEl);
      var y = branch(p, backEl);
      if (x && y && x !== y) {
        forceGrid(p, x, y);
        return true;
      }
      p = p.parentElement;
    }
    return false;
  }

  function designIndex(el) {
    var k = el.getAttribute("data-key-path") || el.getAttribute("data-typed-key-path") || "";
    var m = k.match(/designs\.(\d+)\./);
    return m ? m[1] : null;
  }

  function run() {
    var fields = document.querySelectorAll(
      "[data-key-path], [data-typed-key-path]"
    );
    var fronts = [];
    var backs = [];
    for (var i = 0; i < fields.length; i++) {
      var el = fields[i];
      if (isFront(el)) fronts.push(el);
      else if (isBack(el)) backs.push(el);
    }

    var usedBack = new Set();
    fronts.forEach(function (f) {
      var fi = designIndex(f);
      var match = null;
      for (var j = 0; j < backs.length; j++) {
        var b = backs[j];
        if (usedBack.has(b)) continue;
        var bi = designIndex(b);
        if (fi !== null && bi !== null && fi === bi) {
          match = b;
          break;
        }
      }
      if (!match) {
        /* fallback: nearest by vertical position */
        var fr = f.getBoundingClientRect();
        var best = null;
        var bestScore = Infinity;
        backs.forEach(function (b) {
          if (usedBack.has(b)) return;
          var br = b.getBoundingClientRect();
          var sc = Math.abs(br.top - fr.top) * 3 + Math.abs(br.left - fr.left) * 0.05;
          if (sc < bestScore) {
            bestScore = sc;
            best = b;
          }
        });
        if (best && bestScore < 800) match = best;
      }
      if (match) {
        usedBack.add(match);
        pairFields(f, match);
      }
    });

    
    /* إخفاء نص مسار الصورة بجانب المصغّر */
    fields.forEach(function (el) {
      if (!isFront(el) && !isBack(el)) return;
      var links = el.querySelectorAll("a");
      for (var li = 0; li < links.length; li++) {
        var a = links[li];
        var href = a.getAttribute("href") || "";
        var at = String(a.textContent || "").trim();
        if (
          /\/images\//.test(href) ||
          /\/images\//.test(at) ||
          /\.(webp|jpe?g|png|gif|svg)(\?|$)/i.test(href) ||
          /\.(webp|jpe?g|png|gif|svg)(\?|$)/i.test(at) ||
          /^\/?images\//i.test(at)
        ) {
          a.classList.add("msq-hide-image-path");
          a.style.setProperty("display", "none", "important");
        }
      }
      /* نص عادي فيه مسار */
      var walkers = el.querySelectorAll("span, p, div, code, small");
      for (var wi = 0; wi < walkers.length; wi++) {
        var w = walkers[wi];
        if (w.querySelector("img, button, input, a img")) continue;
        var wt = String(w.textContent || "").trim();
        if (
          wt.length > 12 &&
          (/\/images\//.test(wt) || /\.(webp|jpe?g|png)(\?|$)/i.test(wt) || /^\/?images\//i.test(wt)) &&
          !w.querySelector("img")
        ) {
          /* لا تخفِ حاوية فيها صورة */
          if (w.querySelector("img")) continue;
          w.classList.add("msq-hide-image-path");
          w.style.setProperty("display", "none", "important");
        }
      }
    });

    /* زر الإضافة */
    document.querySelectorAll("button").forEach(function (btn) {
      var t = String(btn.innerText || btn.textContent || "").replace(/\s+/g, " ").trim();
      if (/إضافة/.test(t) && /ألبوم|أشكال|شكل|كوليكشن/.test(t)) {
        if (!btn.dataset.msqLabelled) {
          btn.dataset.msqLabelled = "1";
          btn.textContent = "＋ إضافة أشكال للكوليكشن";
        }
      }
    });
  }

  var queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    setTimeout(function () {
      queued = false;
      try { run(); } catch (e) {}
    }, 120);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  if (window.MutationObserver) {
    new MutationObserver(schedule).observe(document.documentElement, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ["data-key-path", "data-typed-key-path", "class", "style"]
    });
  }
  window.addEventListener("resize", schedule);
  document.addEventListener("click", schedule, true);
  setInterval(schedule, 1500);
})();
</script>

</body>
</html>
