<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوقي - أحدث الموديلات</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; padding: 20px; }
    
    header { text-align: center; padding: 20px 0 30px; }
    header h1 { font-size: 28px; color: #0f172a; margin-bottom: 8px; }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-4px); }

    .image-container { position: relative; width: 100%; height: 280px; background: #f1f5f9; }
    .product-image { width: 100%; height: 100%; object-fit: cover; }

    .product-details { padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; }
    .product-title { font-size: 18px; font-weight: 700; color: #0f172a; }
    
    .meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 12px; border-top: 1px solid #f1f5f9; }
    .price-tag { font-size: 20px; font-weight: 800; color: #16a34a; }
  </style>
</head>
<body>

  <header>
    <h1>معرض المنتجات والموديلات الحالية</h1>
  </header>

  <main class="products-grid" id="products-container">
    <p style="grid-column: 1/-1; text-align: center;">جاري تحميل أحدث المنتجات...</p>
  </main>

  <script>
    async function fetchProducts() {
      const container = document.getElementById('products-container');
      try {
        // المسار الصحيح المربوط بمستودعك الحقيقي ومجلد المنتجات
        const response = await fetch('https://api.github.com/repos/souq-elektroni/My-Souq.github.io/contents/products');
        const files = await response.json();

        if (!Array.isArray(files) || files.length === 0) {
          container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">لا يوجد منتجات معروضة حالياً.</p>';
          return;
        }

        container.innerHTML = '';

        for (const file of files) {
          if (file.name.endsWith('.md')) {
            const res = await fetch(file.download_url);
            const text = await res.text();
            
            // استخراج عنوان المنتج والسعر والصورة
            const titleMatch = text.match(/title:\s*"?([^"\r\n]+)"?/);
            const priceMatch = text.match(/price:\s*"?([^"\r\n]+)"?/);
            const imageMatch = text.match(/image:\s*"?([^"\r\n]+)"?/);

            const title = titleMatch ? titleMatch[1].trim() : 'منتج بدون عنوان';
            const price = priceMatch ? priceMatch[1].trim() : '';
            let image = imageMatch ? imageMatch[1].trim() : 'https://via.placeholder.com/300';

            // مسار الصورة في حال كان نسبياً
            if (image.startsWith('/')) {
              image = image.substring(1);
            }

            container.innerHTML += `
              <div class="product-card">
                <div class="image-container">
                  <img class="product-image" src="${image}" alt="${title}">
                </div>
                <div class="product-details">
                  <h2 class="product-title">${title}</h2>
                  <div class="meta-row">
                    <span class="price-tag">${price} ج.م</span>
                  </div>
                </div>
              </div>
            `;
          }
        }
      } catch (err) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">حدث خطأ أثناء تحميل المنتجات.</p>';
      }
    }

    fetchProducts();
  </script>
</body>
</html>
