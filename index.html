<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوقي - معرض المنتجات</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; padding: 20px; min-height: 100vh; }
    
    header { text-align: center; padding: 20px 0 30px; }
    header h1 { font-size: 28px; color: #0f172a; margin-bottom: 8px; }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* كارت المنتج */
    .product-card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

    .image-container { position: relative; width: 100%; height: 260px; background: #f1f5f9; }
    .product-image { width: 100%; height: 100%; object-fit: cover; }

    .product-details { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
    .product-title { font-size: 18px; font-weight: 700; color: #0f172a; }
    .price-tag { font-size: 20px; font-weight: 800; color: #16a34a; margin-top: auto; }
    .click-hint { font-size: 13px; color: #2563eb; font-weight: 600; text-align: center; margin-top: 8px; background: #eff6ff; padding: 6px; border-radius: 8px; }

    /* النافذة المنبثقة (Modal) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #ffffff; border-radius: 20px; max-width: 650px; width: 100%;
      max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
      display: flex; flex-direction: column; position: relative; animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .close-btn {
      position: absolute; top: 12px; left: 12px; background: #f1f5f9; border: none;
      width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; z-index: 10;
    }

    .modal-body { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 24px; }
    @media (min-width: 550px) { .modal-body { grid-template-columns: 1fr 1fr; } }

    .modal-img { width: 100%; height: 280px; object-fit: cover; border-radius: 12px; }
    .modal-info { display: flex; flex-direction: column; gap: 12px; }
    .modal-title { font-size: 22px; font-weight: 800; color: #0f172a; }
    .modal-price { font-size: 24px; font-weight: 800; color: #16a34a; transition: all 0.2s; }

    /* اختيار المقاسات */
    .size-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .size-btn {
      padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 8px; background: white;
      cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s;
    }
    .size-btn.selected { background: #2563eb; color: white; border-color: #2563eb; }

    /* أبعاد المنتج للمقاس المحدد */
    .dimensions-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; font-size: 14px; display: flex; gap: 16px; }
    .dimensions-box div { display: flex; align-items: center; gap: 4px; }
    .dimensions-box span { font-weight: bold; color: #0f172a; }

    .order-btn {
      background: #25d366; color: white; border: none; padding: 12px;
      border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;
      text-align: center; text-decoration: none; display: block; margin-top: 10px;
    }
    .order-btn:hover { background: #1eb954; }
  </style>
</head>
<body>

  <header>
    <h1>معرض المنتجات والموديلات الحالية</h1>
  </header>

  <main class="products-grid" id="products-container">
    <p style="grid-column: 1/-1; text-align: center;">جاري تحميل أحدث المنتجات...</p>
  </main>

  <!-- النافذة المنبثقة للتفاصيل والمقاسات -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <div class="modal-body">
        <img class="modal-img" id="modalImage" src="" alt="">
        <div class="modal-info">
          <h2 class="modal-title" id="modalTitle"></h2>
          
          <div>
            <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 6px;">اختر المقاس:</label>
            <div class="size-selector" id="sizesContainer">
              <!-- أزرار المقاسات -->
            </div>
          </div>

          <div class="modal-price" id="modalPrice">- ج.م</div>

          <div id="dimensionsContainer" class="dimensions-box" style="display: none;">
            <div>📏 <span>الطول:</span> <span id="modalLength">-</span> سم</div>
            <div>📐 <span>العرض:</span> <span id="modalWidth">-</span> سم</div>
          </div>

          <p id="modalDesc" style="font-size: 14px; color: #64748b; line-height: 1.5;"></p>

          <a href="#" id="whatsappBtn" target="_blank" class="order-btn">اطلب عبر WhatsApp 💬</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const phoneNumber = "201000000000"; // اكتب رقمك بالصيغة الدولية
    let currentProduct = {};
    let currentVariant = {};

    async function fetchProducts() {
      const container = document.getElementById('products-container');
      try {
        const response = await fetch('https://api.github.com/repos/souq-elektroni/My-Souq.github.io/contents/products');
        const files = await response.json();

        if (!Array.isArray(files) || files.length === 0) {
          container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">لا يوجد منتجات معروضة حالياً.</p>';
          return;
        }

        container.innerHTML = '';

        for (const file of files) {
          if (file.name.endsWith('.md')) {
            const res = await fetch(file.download_url);
            const text = await res.text();
            
            const title = text.match(/title:\s*"?([^"\r\n]+)"?/)?.[1]?.trim() || 'منتج بدون عنوان';
            let image = text.match(/image:\s*"?([^"\r\n]+)"?/)?.[1]?.trim() || 'https://via.placeholder.com/300';
            if (image.startsWith('/')) image = image.substring(1);

            const bodyParts = text.split('---');
            const desc = bodyParts.length > 2 ? bodyParts.slice(2).join('---').trim() : '';

            // استخراج خيارات المقاسات والتفاصيل
            const variants = parseVariants(text);
            const defaultPrice = variants.length > 0 ? variants[0].price : (text.match(/price:\s*"?([^"\r\n]+)"?/)?.[1]?.trim() || '');

            const productData = { title, image, desc, variants };

            const card = document.createElement('div');
            card.className = 'product-card';
            card.onclick = () => openModal(productData);
            card.innerHTML = `
              <div class="image-container">
                <img class="product-image" src="${image}" alt="${title}">
              </div>
              <div class="product-details">
                <h2 class="product-title">${title}</h2>
                <span class="price-tag">${defaultPrice ? defaultPrice + ' ج.م' : ''}</span>
                <div class="click-hint">اضغط لرؤية المقاسات والتفاصيل 👈</div>
              </div>
            `;
            container.appendChild(card);
          }
        }
      } catch (err) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">حدث خطأ أثناء تحميل المنتجات.</p>';
      }
    }

    // تحليل بيانات المقاسات المتاحة داخل الملف
    function parseVariants(text) {
      const variants = [];
      const variantsBlock = text.match(/variants:([\s\S]*?)(?=\n[a-z]+:|\n---)/i);
      
      if (variantsBlock) {
        const items = variantsBlock[1].split('- size:');
        items.forEach(item => {
          if (!item.trim()) return;
          const size = item.match(/^\s*"?([^"\r\n]+)"?/)?.[1]?.trim();
          const price = item.match(/price:\s*"?([^"\r\n]+)"?/)?.[1]?.trim();
          const length = item.match(/length:\s*"?([^"\r\n]+)"?/)?.[1]?.trim();
          const width = item.match(/width:\s*"?([^"\r\n]+)"?/)?.[1]?.trim();

          if (size) {
            variants.push({ size, price: price || '', length: length || '', width: width || '' });
          }
        });
      }
      return variants;
    }

    function openModal(product) {
      currentProduct = product;
      document.getElementById('modalTitle').innerText = product.title;
      document.getElementById('modalImage').src = product.image;
      document.getElementById('modalDesc').innerText = product.desc;

      const sizesContainer = document.getElementById('sizesContainer');
      sizesContainer.innerHTML = '';

      if (product.variants && product.variants.length > 0) {
        product.variants.forEach((variant, idx) => {
          const btn = document.createElement('button');
          btn.className = `size-btn ${idx === 0 ? 'selected' : ''}`;
          btn.innerText = variant.size;
          btn.onclick = () => selectVariant(variant, btn);
          sizesContainer.appendChild(btn);
        });

        // اختيار المقاس الأول تلقائياً
        selectVariant(product.variants[0], sizesContainer.children[0]);
      } else {
        sizesContainer.innerHTML = '<span style="font-size:13px; color:#64748b;">مقاس موحد</span>';
        document.getElementById('modalPrice').innerText = '- ج.م';
        document.getElementById('dimensionsContainer').style.display = 'none';
      }

      document.getElementById('productModal').classList.add('active');
    }

    function selectVariant(variant, btnElement) {
      currentVariant = variant;

      // تحديث زر المقاس المحدد
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
      if (btnElement) btnElement.classList.add('selected');

      // تحديث السعر بناءً على المقاس
      document.getElementById('modalPrice').innerText = variant.price ? `${variant.price} ج.م` : '';

      // تحديث الأبعاد (الطول والعرض)
      const dimBox = document.getElementById('dimensionsContainer');
      if (variant.length || variant.width) {
        dimBox.style.display = 'flex';
        document.getElementById('modalLength').innerText = variant.length || '-';
        document.getElementById('modalWidth').innerText = variant.width || '-';
      } else {
        dimBox.style.display = 'none';
      }

      updateWhatsappLink();
    }

    function closeModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    function updateWhatsappLink() {
      let detailsText = `المقاس: ${currentVariant.size || 'عام'}`;
      if (currentVariant.price) detailsText += ` | السعر: ${currentVariant.price} ج.م`;
      if (currentVariant.length) detailsText += ` | الطول: ${currentVariant.length}سم`;
      if (currentVariant.width) detailsText += ` | العرض: ${currentVariant.width}سم`;

      const msg = encodeURIComponent(`أهلاً بك، أريد طلب المنتج: ${currentProduct.title}\n التفاصيل: (${detailsText})`);
      document.getElementById('whatsappBtn').href = `https://wa.me/${phoneNumber}?text=${msg}`;
    }

    fetchProducts();
  </script>
</body>
</html>
