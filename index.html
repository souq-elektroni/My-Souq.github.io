<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Souq - متجري</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-white dark:bg-gray-800 shadow sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="text-2xl font-bold text-primary"><i class="fa-solid fa-store ml-2"></i>My Souq</span>
            </div>
            <div class="flex items-center space-x-4 space-x-reverse">
                <!-- Dark Mode Toggle -->
                <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-xl">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
                <!-- Orders Tracking Button -->
                <button onclick="openTrackerModal()" class="relative p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-xl" title="تتبع الطلبات">
                    <i class="fa-solid fa-box-archive"></i>
                </button>
                <!-- Cart Button -->
                <button onclick="openCartModal()" class="relative p-2 rounded-full bg-primary/10 text-primary hover:bg-primary/20 text-xl">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <!-- Banner / Hero Section -->
        <div class="bg-gradient-to-r from-primary to-indigo-700 rounded-2xl p-6 md:p-10 text-white mb-8 shadow-lg">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-3">أهلاً بك في My Souq</h1>
            <p class="text-indigo-100 text-lg mb-6">تسوق أحدث المنتجات بأفضل الأسعار، جودة مضمونة وتوصيل سريع.</p>
            <a href="#products" class="bg-white text-primary font-bold px-6 py-3 rounded-xl shadow hover:bg-indigo-50 transition">تسوق الآن</a>
        </div>

        <!-- Products Grid Section -->
        <section id="products">
            <h2 class="text-2xl font-bold mb-6 flex items-center"><i class="fa-solid fa-bag-shopping ml-2 text-primary"></i> المنتجات المتوفرة</h2>
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Products will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <!-- Cart Modal -->
    <div id="cartModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-white dark:bg-gray-800 w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-6 transform transition-transform">
            <div>
                <div class="flex justify-between items-center border-b pb-4 dark:border-gray-700">
                    <h3 class="text-xl font-bold"><i class="fa-solid fa-cart-shopping ml-2 text-primary"></i> سلة التسوق</h3>
                    <button onclick="closeCartModal()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 text-xl"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="cartItemsList" class="divide-y dark:divide-gray-700 overflow-y-auto max-h-[50vh] my-4">
                    <!-- Cart Items -->
                </div>
            </div>
            <div class="border-t pt-4 dark:border-gray-700">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>المجموع الكلي:</span>
                    <span id="cartTotalPrice">0.00 ج.م</span>
                </div>
                <button onclick="openCheckoutModal()" class="w-full bg-primary text-white py-3 rounded-xl font-bold shadow hover:bg-indigo-700 transition">إتمام الطلب</button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-2xl shadow-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 dark:border-gray-700 mb-4">
                <h3 class="text-xl font-bold"><i class="fa-solid fa-file-invoice ml-2 text-primary"></i> بيانات الشحن وإتمام الطلب</h3>
                <button onclick="closeCheckoutModal()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">الاسم الكامل</label>
                    <input type="text" id="custName" required class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">رقم الهاتف (واتساب)</label>
                    <input type="tel" id="custPhone" required class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">عنوان الشحن بالتفصيل</label>
                    <textarea id="custAddress" rows="3" required class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:border-primary"></textarea>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow hover:bg-green-700 transition"><i class="fa-brands fa-whatsapp ml-2"></i> تأكيد الطلب وإرسال عبر واتساب</button>
            </form>
        </div>
    </div>

    <!-- Tracker Modal -->
    <div id="trackerModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-2xl shadow-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 dark:border-gray-700 mb-4">
                <h3 class="text-xl font-bold"><i class="fa-solid fa-box-archive ml-2 text-primary"></i> تتبع الطلبات السابقة</h3>
                <button onclick="closeTrackerModal()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="ordersListContainer" class="space-y-3">
                <!-- Orders tracking list -->
                <p class="text-gray-500 text-center py-4">لا توجد طلبات مسجلة حتى الآن.</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 shadow mt-12 py-6 text-center text-sm text-gray-500 dark:text-gray-400">
        <p>&copy; 2026 My Souq. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://mysouq-default-rtdb.firebaseio.com/"
        };
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
        } catch (e) {
            console.log("Firebase initialization info:", e);
        }

        // Sample Products
        const products = [
            { id: 1, title: 'سماعة بلوتوث لاسلكية', price: 450, image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60' },
            { id: 2, title: 'ساعة ذكية رياضية', price: 750, image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60' },
            { id: 3, title: 'حذاء رياضي أنيق', price: 600, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60' },
            { id: 4, title: 'حقيبة ظهر مدرسية / كاجوال', price: 350, image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&auto=format&fit=crop&q=60' }
        ];

        let cart = JSON.parse(localStorage.getItem('mySouqCart')) || [];

        // Dark Mode Toggle Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        }
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.setItem('theme', htmlElement.classList.contains('dark') ? 'dark' : 'light');
        });

        // Render Products
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow overflow-hidden flex flex-col justify-between border dark:border-gray-700">
                    <img src="${p.image}" alt="${p.title}" class="h-48 w-full object-cover">
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-bold text-lg mb-1">${p.title}</h3>
                            <p class="text-primary font-extrabold text-lg mb-4">${p.price} ج.م</p>
                        </div>
                        <button onclick="addToCart(${p.id})" class="w-full bg-primary/10 text-primary font-bold py-2 rounded-xl hover:bg-primary hover:text-white transition">
                            <i class="fa-solid fa-cart-plus ml-1"></i> أضف للسلة
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Cart Functions
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            localStorage.setItem('mySouqCart', JSON.stringify(cart));
            const badge = document.getElementById('cartBadge');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.textContent = totalItems;

            const list = document.getElementById('cartItemsList');
            if (cart.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-6">السلة فارغة حالياً.</p>`;
            } else {
                list.innerHTML = cart.map(item => `
                    <div class="flex justify-between items-center py-3">
                        <div class="flex items-center space-x-3 space-x-reverse">
                            <img src="${item.image}" class="w-12 h-12 rounded-lg object-cover">
                            <div>
                                <h4 class="font-bold text-sm">${item.title}</h4>
                                <p class="text-xs text-gray-500">${item.price} ج.م × ${item.qty}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 space-x-reverse">
                            <button onclick="changeQty(${item.id}, 1)" class="px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded">+</button>
                            <span class="text-sm font-bold">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, -1)" class="px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded">-</button>
                        </div>
                    </div>
                `).join('');
            }

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cartTotalPrice').textContent = totalPrice + ' ج.م';
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                updateCart();
            }
        }

        // Modals Control
        function openCartModal() { document.getElementById('cartModal').classList.remove('hidden'); updateCart(); }
        function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }
        function openCheckoutModal() { 
            if(cart.length === 0) { alert('السلة فارغة!'); return; }
            closeCartModal();
            document.getElementById('checkoutModal').classList.remove('hidden'); 
        }
        function closeCheckoutModal() { document.getElementById('checkoutModal').classList.add('hidden'); }
        function openTrackerModal() { 
            document.getElementById('trackerModal').classList.remove('hidden'); 
            loadOrdersTracker();
        }
        function closeTrackerModal() { document.getElementById('trackerModal').classList.add('hidden'); }

        // Submit Order & WhatsApp Integration
        function submitOrder(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;

            const orderDetails = cart.map(i => `- ${i.title} (الكمية: ${i.qty}) - ${i.price * i.qty} ج.م`).join('\n');
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // Save to LocalStorage Tracker
            let localOrders = JSON.parse(localStorage.getItem('mySouqOrders')) || [];
            const newOrder = {
                id: 'MS-' + Math.floor(1000 + Math.random() * 9000),
                date: new Date().toLocaleString(),
                name, phone, address, items: cart, total: totalPrice, status: 'قيد المراجعة'
            };
            localOrders.push(newOrder);
            localStorage.setItem('mySouqOrders', JSON.stringify(localOrders));

            // WhatsApp Message Text
            const message = `مرحباً، أود تأكيد طلب جديد:%0a*الاسم:* ${name}%0a*الهاتف:* ${phone}%0a*العنوان:* ${address}%0a%0a*المنتجات:*%0a${encodeURIComponent(orderDetails)}%0a%0a*المجموع الكلي:* ${totalPrice} ج.م`;
            
            // Clear Cart
            cart = [];
            updateCart();
            closeCheckoutModal();

            // Open WhatsApp
            window.open(`https://wa.me/201000000000?text=${message}`, '_blank');
            alert('تم تسجيل طلبك بنجاح وتحويلك للواتساب لإتمام التأكيد!');
        }

        function loadOrdersTracker() {
            let localOrders = JSON.parse(localStorage.getItem('mySouqOrders')) || [];
            const container = document.getElementById('ordersListContainer');
            if (localOrders.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-4">لا توجد طلبات مسجلة حتى الآن.</p>`;
            } else {
                container.innerHTML = localOrders.map(o => `
                    <div class="border dark:border-gray-700 rounded-xl p-4 bg-gray-50 dark:bg-gray-700/50">
                        <div class="flex justify-between font-bold mb-1">
                            <span>رقم الطلب: ${o.id}</span>
                            <span class="text-primary text-sm">${o.status}</span>
                        </div>
                        <p class="text-xs text-gray-500 mb-2">${o.date}</p>
                        <p class="text-sm font-semibold">المجموع: ${o.total} ج.م</p>
                    </div>
                `).join('');
            }
        }

        // Initialize App on Load
        renderProducts();
        updateCart();
    </script>
</body>
</html>
