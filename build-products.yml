name: Build products.json

# كل ما منتج يتحفظ من لوحة الإدارة (commit على products/)، الملف ده بيعيد بناء products.json لوحده.
on:
  push:
    branches: [main]
    paths:
      - 'products/**'
      - 'tools/build-products.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-products
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build products.json
        run: python3 tools/build-products.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain products.json)" ]; then
            echo "products.json لم يتغير"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "chore: rebuild products.json"
          git pull --rebase origin main
          git push
