<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" role="img" aria-label="My Souq">
  <defs>
    <linearGradient id="bg" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#8f4d60"/>
      <stop offset="50%" stop-color="#7a3548"/>
      <stop offset="100%" stop-color="#3c1824"/>
    </linearGradient>
    <linearGradient id="glass" x1="50%" y1="0%" x2="50%" y2="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2dfe4"/>
    </linearGradient>
    <linearGradient id="txt" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7eef1"/>
    </linearGradient>
    <!-- قوس علوي فقط (من اليسار لليمين عبر الأعلى) -->
    <path id="topArc" d="M 22,64 A 42,42 0 0 1 106,64" fill="none"/>
  </defs>

  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="64" fill="url(#glass)"/>
  <circle cx="64" cy="64" r="58.5" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="0.9"/>
  <circle cx="64" cy="64" r="37" fill="none" stroke="#ffffff" stroke-opacity=".11" stroke-width="1"/>

  <!-- الكتابة مرة واحدة فوق فقط -->
  <text fill="url(#txt)"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="11"
        font-weight="700"
        letter-spacing="3.5"
        opacity=".96">
    <textPath xlink:href="#topArc" href="#topArc" startOffset="50%" text-anchor="middle">
      MY SOUQ
    </textPath>
  </text>

  <!-- السلة في المنتصف -->
  <g fill="none" stroke="url(#fg)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M51 60c0-5.8 4.9-10.2 13-10.2s13 4.4 13 10.2" stroke-width="3.6"/>
    <rect x="44" y="60" width="40" height="29" rx="6" stroke-width="3.6"/>
    <path d="M44 69.5h40" stroke-width="2.3" stroke-opacity=".42"/>
  </g>
</svg>
